import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const rand = (a, b) => a + (b - a) * Math.random();

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function canvasTex(w, h, draw, repeatX = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (repeatX !== 1) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = repeatX; }
  return t;
}

});

const streakCache = new Map();
function streakTex(rgb) {
  if (streakCache.has(rgb)) return streakCache.get(rgb);
  const t = canvasTex(64, 256, (g) => {
    const v = g.createLinearGradient(0, 0, 0, 256);
    v.addColorStop(0, `rgba(${rgb},0.92)`);
    v.addColorStop(0.55, `rgba(${rgb},0.28)`);
    v.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = v; g.fillRect(0, 0, 64, 256);
    g.globalCompositeOperation = 'destination-in';
    const h = g.createLinearGradient(0, 0, 64, 0);
    h.addColorStop(0, 'rgba(0,0,0,0)');
    h.addColorStop(0.5, 'rgba(0,0,0,1)');
    h.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = h; g.fillRect(0, 0, 64, 256);
  });
  streakCache.set(rgb, t);
  return t;
}

const canopyTex = canvasTex(1024, 64, (g) => {
  g.fillStyle = '#f5f7fa'; g.fillRect(0, 0, 1024, 64);
  g.fillStyle = '#0e9e57'; g.fillRect(0, 0, 1024, 22);
  g.fillStyle = '#1673c7'; g.fillRect(0, 22, 1024, 16);
  g.fillStyle = '#0e9e57';
  for (let i = 0; i < 16; i++) g.fillRect(i * 64 + 24, 44, 18, 20);
});

const lanternTex = canvasTex(128, 128, (g) => {
  g.fillStyle = '#e6453a'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = 'rgba(255,255,255,0.32)';
  [18, 60, 102].forEach((y) => g.fillRect(0, y, 128, 6));
  g.beginPath(); g.arc(64, 64, 32, 0, Math.PI * 2);
  g.fillStyle = '#fdf6ec'; g.fill();
  g.fillStyle = '#e6453a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 42px "Hiragino Sans","Yu Gothic",sans-serif';
  g.fillText('祭', 64, 66);
});

const tactileTex = canvasTex(256, 32, (g) => {
  g.fillStyle = '#cfa63f'; g.fillRect(0, 0, 256, 32);
  g.fillStyle = 'rgba(158,118,20,0.5)';
  for (let x = 16; x < 256; x += 32) {
    g.beginPath(); g.arc(x, 8, 5, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x, 24, 5, 0, Math.PI * 2); g.fill();
  }
}, 10);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0f18, 56, 92);
scene.background = canvasTex(32, 512, (g) => {
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#1c2740');
  gr.addColorStop(0.45, '#101725');
  gr.addColorStop(1, '#05070c');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 512);
});

const FRUSTUM_V = 17.5;
const FRAME_W = 18.4;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 20, 140);
const ISO_TARGET = new THREE.Vector3(0, 2.5, 0);
const ISO_POS = new THREE.Vector3(1, 1, 1).normalize().multiplyScalar(60).add(ISO_TARGET);
camera.position.copy(ISO_POS);
camera.lookAt(ISO_TARGET);

const fpCam = new THREE.PerspectiveCamera(62, 1, 0.05, 200);
fpCam.rotation.order = 'YXZ';
const FP_EYE = 1.62;
const fpPos = new THREE.Vector3(0.95, 0, -0.15);
const fpLookAt = new THREE.Vector3(-3.2, 1.35, -1.7);
let yaw = 0, pitch = 0, camY = 0.18 + FP_EYE;
{
  const d = fpLookAt.clone().sub(new THREE.Vector3(fpPos.x, camY, fpPos.z)).normalize();
  yaw = Math.atan2(-d.x, -d.z);
  pitch = Math.asin(Math.max(-1, Math.min(1, d.y)));
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(ISO_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.6;
controls.minZoom = 0.5;
controls.maxZoom = 4.5;
controls.minPolarAngle = 0.12 * Math.PI;
controls.maxPolarAngle = 0.487 * Math.PI;
controls.maxTargetRadius = 5.5;
controls.update();

function resize() {
  const a = window.innerWidth / window.innerHeight;
  const v = Math.max(FRUSTUM_V, FRAME_W / a);
  camera.left = -v * a / 2; camera.right = v * a / 2;
  camera.top = v / 2; camera.bottom = -v / 2;
  camera.updateProjectionMatrix();
  fpCam.aspect = a;
  fpCam.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
resize();
window.addEventListener('resize', resize);

const toggleBtn = document.getElementById('toggle');
const tipEl = document.getElementById('tip');
let mode = 'iso';
let isoPosSaved = null;
let isoZoomSaved = 1;
let dragging = false;
let lastX = 0, lastY = 0;
let touchId = null, touchX = 0, touchY = 0;
const keys = new Set();

function resetIso() {
  camera.position.copy(ISO_POS);
  controls.target.copy(ISO_TARGET);
  camera.zoom = 1;
  camera.updateProjectionMatrix();
  controls.update();
}

function blockedFP(x, z) {
  if (x < -5.5 || x > 5.5 || z < -5.5 || z > 5.5) return true;
  if (x > -5.15 && x < -0.2 && z > -5.1 && z < -1.0) return true;
  if (x > 0.0 && x < 0.92 && z > -1.75 && z < -0.85) return true;
  if (x > 0.88 && x < 1.7 && z > -1.7 && z < -0.85) return true;
  if (x > -5.1 && x < -3.75 && z > -1.05 && z < -0.6) return true;
  if (x > -2.0 && x < -1.4 && z > -0.95 && z < -0.5) return true;
  const pdx = x - 1.35, pdz = z - 1.35;
  if (pdx * pdx + pdz * pdz < 0.1) return true;
  const cdx = x - 2.75, cdz = z - 3.15;
  if (cdx * cdx + cdz * cdz < 0.14) return true;
  return false;
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  if (mode === 'fp') {
    isoPosSaved = camera.position.clone();
    isoZoomSaved = camera.zoom;
    controls.enabled = false;
    document.body.classList.add('fp');
    toggleBtn.textContent = '回到等距微缩盒';
    tipEl.textContent = '拖动转视角 · WASD / 方向键走动 · Shift 加速 · Esc 释放鼠标 · F 返回等距';
    fpCam.position.set(fpPos.x, camY, fpPos.z);
    fpCam.rotation.set(pitch, yaw, 0);
  } else {
    if (document.pointerLockElement) document.exitPointerLock();
    controls.enabled = true;
    if (isoPosSaved) camera.position.copy(isoPosSaved);
    camera.zoom = isoZoomSaved;
    camera.updateProjectionMatrix();
    controls.update();
    document.body.classList.remove('fp');
    toggleBtn.textContent = '第一人称进入';
    tipEl.textContent = '拖动旋转 · 滚轮缩放 · 右键平移 · R 重置视角 · 按 F 或点按钮进入第一人称';
  }
}

toggleBtn.addEventListener('click', () => setMode(mode === 'fp' ? 'iso' : 'fp'));
toggleBtn.addEventListener('pointerdown', (e) => e.stopPropagation());

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyF') { setMode(mode === 'fp' ? 'iso' : 'fp'); return; }
  if (e.code === 'KeyR' && mode === 'iso') { resetIso(); return; }
  if (mode === 'fp' && e.code.indexOf('Arrow') === 0) e.preventDefault();
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

renderer.domElement.addEventListener('mousedown', (e) => {
  if (mode !== 'fp') return;
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  try {
    const p = renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  } catch (err) {}
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('mousemove', (e) => {
  if (mode !== 'fp') return;
  let mx = 0, my = 0;
  if (document.pointerLockElement === renderer.domElement) {
    mx = e.movementX; my = e.movementY;
  } else if (dragging) {
    mx = e.clientX - lastX; my = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
  } else return;
  yaw -= mx * 0.0028;
  pitch = Math.max(-1.35, Math.min(1.35, pitch - my * 0.0028));
});
renderer.domElement.addEventListener('touchstart', (e) => {
  if (mode !== 'fp') return;
  const t = e.changedTouches[0];
  touchId = t.identifier; touchX = t.clientX; touchY = t.clientY;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (mode !== 'fp' || touchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    yaw -= (t.clientX - touchX) * 0.005;
    pitch = Math.max(-1.35, Math.min(1.35, pitch - (t.clientY - touchY) * 0.005));
    touchX = t.clientX; touchY = t.clientY;
  }
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => { touchId = null; }, { passive: true });

let bobT = 0;
function updateFP(dt) {
  const fwd = ((keys.has('KeyW') || keys.has('ArrowUp')) ? 1 : 0) - ((keys.has('KeyS') || keys.has('ArrowDown')) ? 1 : 0);
  const side = ((keys.has('KeyD') || keys.has('ArrowRight')) ? 1 : 0) - ((keys.has('KeyA') || keys.has('ArrowLeft')) ? 1 : 0);
  const moving = fwd !== 0 || side !== 0;
  if (moving) {
    const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 3.4 : 1.8;
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    const mx = (-sin * fwd + cos * side) * speed * dt;
    const mz = (-cos * fwd - sin * side) * speed * dt;
    if (!blockedFP(fpPos.x + mx, fpPos.z + mz)) {
      fpPos.x += mx; fpPos.z += mz;
    } else if (!blockedFP(fpPos.x + mx, fpPos.z)) {
      fpPos.x += mx;
    } else if (!blockedFP(fpPos.x, fpPos.z + mz)) {
      fpPos.z += mz;
    }
    bobT += dt * speed * 3.2;
  } else {
    bobT += dt * 1.1;
  }
  camY += (groundY(fpPos.x, fpPos.z) + FP_EYE - camY) * Math.min(1, dt * 9);
  const bob = moving ? Math.sin(bobT) * 0.028 : Math.sin(bobT) * 0.004;
  fpCam.position.set(fpPos.x, camY + bob, fpPos.z);
  fpCam.rotation.set(pitch, yaw, 0);
}

const hemi = new THREE.HemisphereLight(0x9db9e8, 0x323a49, 0.72);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xcfe0ff, 1.4);
key.position.set(-9, 13, -7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
key.shadow.camera.near = 2; key.shadow.camera.far = 44;
key.shadow.camera.updateProjectionMatrix();
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
key.shadow.radius = 5;
key.target.position.set(0, 1, 0);
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0x86a8d8, 0.32);
fill.position.set(8, 6, 9);
scene.add(fill);

const world = new THREE.Group();
scene.add(world);

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, metalness: 0.02, ...opts });
}

function box(parent, w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cyl(parent, rt, rb, h, material, x, y, z, seg = 10) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function ball(parent, r, material, x, y, z, seg = 8) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(4, seg - 2)), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function flatDecal(w, d, x, z, y, angle, tex, opacity, blending) {
  const geo = new THREE.PlaneGeometry(w, d);
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: tex, transparent: true, opacity, depthWrite: false, blending
  }));
  m.position.set(x, y, z);
  m.rotation.y = angle;
  world.add(m);
  return m;
}

function addGlow(x, y, z, scale, color, opacity) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity,

  }));
  s.position.set(x, y, z);
  s.scale.set(scale, scale, 1);
  s.renderOrder = 6;
  world.add(s);
  return s;
}

function spreadReflection(rgb, w, h, bx, bz, y, opacity) {
  return flatDecal(w, h, bx + SQ * h / 2, bz + SQ * h / 2, y, Math.PI / 4,
    streakTex(rgb), opacity, THREE.AdditiveBlending);
}

    new THREE.Vector3((x1 + x2) / 2, Math.min(y1, y2) - sag, (z1 + z2) / 2),
    new THREE.Vector3(x2, y2, z2)
  );
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.013, 4, false), M.wire);
  world.add(m);
  return m;
}

spreadReflection('255,90,74', 0.9, 1.7, 0.45, -1.0, 0.188, 0.18);
spreadReflection('255,217,160', 0.5, 3.2, 1.35, 2.2, 0.011, 0.2);
spreadReflection('191,230,255', 0.7, 2.0, -0.7, -0.55, 0.188, 0.12);
spreadReflection('255,138,90', 0.5, 1.1, -0.34, -1.55, 0.188, 0.12);

addGlow(1.35, 4.4, 2.2, 3.4, 0xffd9a0, 0.42);
addGlow(-2.0, 1.9, -0.6, 1.3, 0xff8060, 0.45);
addGlow(0.45, 0.95, -0.97, 1.8, 0xff8a7a, 0.3);
addGlow(-4.15, 1.45, -1.0, 2.4, 0xffcf9a, 0.22);
addGlow(-1.3, 1.45, -1.0, 2.4, 0xffcf9a, 0.22);
addGlow(-2.8, 1.26, -1.0, 2.0, 0xffd9a0, 0.2);
addGlow(-0.7, 3.05, -0.85, 2.0, 0xbfe6ff, 0.22);
addGlow(-0.22, 1.8, -1.55, 0.9, 0xff8a6a, 0.3);
for (const [gx, gz] of [[-5.86, -5.86], [5.86, -5.86], [-5.86, 5.86], [5.86, 5.86]]) {
  addGlow(gx, 6.42, gz, 0.8, 0x8fe6ff, 0.3);
}

const storeLight = new THREE.PointLight(0xffc98a, 7, 7.5, 2);
storeLight.position.set(-2.8, 1.45, -0.85);
world.add(storeLight);
const eaveLight = new THREE.PointLight(0xffc27a, 3, 3.4, 2);
eaveLight.position.set(-2.9, 2.0, -0.8);
world.add(eaveLight);
const lanternLight = new THREE.PointLight(0xff7a55, 2, 2.6, 2);
lanternLight.position.set(-2.0, 1.9, -0.6);
world.add(lanternLight);
const vendLight = new THREE.PointLight(0xff6a5a, 2.5, 3, 2);
vendLight.position.set(0.45, 1.25, -0.95);
world.add(vendLight);
const streetLight = new THREE.PointLight(0xffd9a0, 8, 9, 2);
streetLight.position.set(1.35, 4.3, 2.2);
world.add(streetLight);

const caseGlow = new THREE.MeshBasicMaterial({ color: 0x8fe0ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false });
const casePane = new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.035, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
for (const sx of [-1, 1]) {
  for (const sz of [-1, 1]) {
    const p = box(world, 0.06, 6.4, 0.06, caseGlow, sx * 5.86, 3.2, sz * 5.86);
    p.castShadow = false; p.receiveShadow = false; p.renderOrder = 8;
  }
}
for (const sz of [-1, 1]) {
  const p = box(world, 11.78, 0.05, 0.05, caseGlow, 0, 6.4, sz * 5.86);
  p.castShadow = false; p.receiveShadow = false; p.renderOrder = 8;
  const q = box(world, 0.05, 0.05, 11.78, caseGlow, sz * 5.86, 6.4, 0);
  q.castShadow = false; q.receiveShadow = false; q.renderOrder = 8;
}
const paneSides = [
  [0, 0, 5.86, 0], [0, 0, -5.86, 0], [5.86, 0, 0, Math.PI / 2], [-5.86, 0, 0, Math.PI / 2]
];
for (const [px, py, pz, ry] of paneSides) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(11.72, 6.4), casePane);
  p.geometry.rotateY(ry);
  p.position.set(px, 3.2, pz);
  p.renderOrder = 9;
  world.add(p);
}
const topPane = new THREE.Mesh(new THREE.PlaneGeometry(11.72, 11.72), casePane);
topPane.geometry.rotateX(-Math.PI / 2);
topPane.position.set(0, 6.42, 0);
topPane.renderOrder = 9;
world.add(topPane);

const RAIN_COUNT = 640;
const rain = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.014, 0.5, 0.014),
  new THREE.MeshBasicMaterial({ color: 0xbdd7f2, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false }),
  RAIN_COUNT
);
rain.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
rain.frustumCulled = false;
world.add(rain);

const drops = [];
for (let i = 0; i < RAIN_COUNT; i++) {
  drops.push({
    x: rand(-5.7, 5.7), y: rand(0.4, 6.3), z: rand(-5.7, 5.7),
    v: rand(9, 15), s: rand(0.7, 1.6)
  });
}
const dummy = new THREE.Object3D();

function groundY(x, z) {
  return (x < 1.8 && z < 1.8) ? 0.18 : 0;
}
function underCanopy(x, z) {
  return x > -5.08 && x < 1.83 && z > -1.2 && z < 0.08;
}
function inStore(x, z) {
  return x > -5.05 && x < -0.3 && z > -5.0 && z < -1.1;
}

function updateRain(dt) {
  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = drops[i];
    d.y -= d.v * dt;
    d.x += 0.4 * dt;
    if (d.x > 5.72) d.x -= 11.44;
    let land = groundY(d.x, d.z);
    if (inStore(d.x, d.z)) land = Math.max(land, 3.5);
    if (underCanopy(d.x, d.z)) land = Math.max(land, 2.45);
    if (d.y < land) {
      d.x = rand(-5.7, 5.7); d.z = rand(-5.7, 5.7); d.y = rand(4.4, 6.32);
    }
    dummy.position.set(d.x, d.y, d.z);
    dummy.rotation.set(0.02, 0, 0.09);
    dummy.scale.set(1, d.s, 1);
    dummy.updateMatrix();
    rain.setMatrixAt(i, dummy.matrix);
  }
  rain.instanceMatrix.needsUpdate = true;
}

const rippleGeo = new THREE.RingGeometry(0.82, 1, 22);
rippleGeo.rotateX(-Math.PI / 2);
const ripples = [];
for (let i = 0; i < 46; i++) {
  const mesh = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({
    color: 0xbcd9f5, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  mesh.visible = false;
  mesh.renderOrder = 4;
  world.add(mesh);
  ripples.push({ mesh, t: 0, life: 1, max: 0.3 });
}
let rippleIndex = 0;
function spawnRipple(x, z, y, max) {
  rippleIndex = (rippleIndex + 1) % ripples.length;
  const r = ripples[rippleIndex];
  r.t = 0;
  r.life = rand(0.55, 0.95);
  r.max = max;
  r.mesh.position.set(x, y + 0.007, z);
  r.mesh.visible = true;
}
function updateRipples(dt) {
  for (const r of ripples) {
    if (!r.mesh.visible) continue;
    r.t += dt;
    const p = r.t / r.life;
    if (p >= 1) { r.mesh.visible = false; continue; }
    const s = r.max * (1 - Math.pow(1 - p, 2.4));
    r.mesh.scale.set(s, 1, s);
    r.mesh.material.opacity = 0.55 * (1 - p) * (1 - p);
  }
}
let rainRippleTimer = 0;
function spawnRainRipple() {
  let x, z;
  if (Math.random() < 0.55) {
    const sp = puddleSpots[(Math.random() * puddleSpots.length) | 0];
    x = sp[0] + rand(-0.3, 0.3);
    z = sp[1] + rand(-0.2, 0.2);
  } else {
    x = rand(-5.6, 5.6); z = rand(-5.6, 5.6);
    if (underCanopy(x, z) || inStore(x, z)) return;
  }
  spawnRipple(x, z, groundY(x, z), rand(0.16, 0.3));
}

const dripMat = new THREE.MeshBasicMaterial({ color: 0xdff0ff, transparent: true, opacity: 0.85 });
const dripGeo = new THREE.SphereGeometry(0.04, 6, 5);
const drips = [];
for (let i = 0; i < 9; i++) {
  const mesh = new THREE.Mesh(dripGeo, dripMat);
  mesh.visible = false;
  mesh.scale.set(1, 1.8, 1);
  world.add(mesh);
  drips.push({ mesh, x: -4.6 + i * 0.7625, z: 0.0, y: 2.28, v: 0, wait: rand(0, 2), falling: false });
}
function updateDrips(dt) {
  for (const d of drips) {
    if (!d.falling) {
      d.wait -= dt;
      if (d.wait <= 0) {
        d.falling = true;
        d.v = 0;
        d.y = 2.28;
        d.mesh.visible = true;
      }
      continue;
    }
    d.v += 14 * dt;
    d.y -= d.v * dt;
    if (d.y <= 0.19) {
      d.falling = false;
      d.wait = rand(0.5, 2.2);
      d.mesh.visible = false;
      spawnRipple(d.x, d.z, 0.185, 0.42);
      spawnRipple(d.x, d.z, 0.185, 0.24);
      continue;
    }
    d.mesh.position.set(d.x, d.y, d.z);
    d.mesh.scale.set(1, 1 + d.v * 0.09, 1);
  }
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  updateRain(dt);
  updateDrips(dt);
  updateRipples(dt);
  rainRippleTimer -= dt;
  if (rainRippleTimer <= 0) { rainRippleTimer = 0.055; spawnRainRipple(); }
  person.position.y = 0.18 + Math.sin(t * 1.7) * 0.006;
  torso.rotation.x = 0.08 + Math.sin(t * 1.7) * 0.012;
  lantern.rotation.z = Math.sin(t * 1.3) * 0.07;
  lantern.rotation.x = Math.cos(t * 1.05) * 0.05;
  const flick = Math.sin(t * 13.7) > 0.994 ? 0.25 : 1;
  for (const sm of signMats) sm.emissiveIntensity = (0.8 + Math.sin(t * 2.7) * 0.07) * flick;
  neonMat.emissiveIntensity = (1.6 + Math.sin(t * 5.3) * 0.1) * flick;
  storeStreak.material.opacity = 0.16 + Math.sin(t * 1.2) * 0.03;
  if (mode === 'fp') updateFP(dt);
  else controls.update();
  renderer.render(scene, mode === 'fp' ? fpCam : camera);
});
</script>
