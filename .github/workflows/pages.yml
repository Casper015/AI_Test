name: Deploy Multi-Model Forbidden City Showcase to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'imperial*/**'
      - 'portal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all Imperial Palace implementations
        run: |
          echo "Building OpenCode 516k..."
          (cd imperial-palace-opencode-516k && npm run build)

          echo "Building OpenCode 424k..."
          (cd imperial-palace-opencode-424k && npm run build)

          echo "Building Command Code 36M..."
          (cd imperial-palace-commandcode-36m && npm run build)

          echo "Building DSH 1.1B..."
          (cd imperial-palace-dsh-1.1b && npm run build)

          echo "Building GPT-6 Luna..."
          (cd imperial-palace-gpt6luna && npm ci && npm run build)

          echo "Building Gemini 3.8 Flash..."
          (cd "imperial gemini 3.8flash" && npm ci && npm run build)

          echo "Building GPT-6 Luna (Tour)..."
          (cd imperial-palace/luna && npm ci && npm run build)

          echo "Building GPT-6 Sol..."
          (cd imperial-palace/sol && npm ci && npm run build)

      - name: Assemble multi-project exhibition directory
        run: |
          mkdir -p _site/opencode-516k _site/opencode-424k _site/commandcode-36m _site/dsh-1.1b _site/gpt6luna _site/gemini-3.8flash _site/imperial-palace _site/gpt6-luna _site/gpt6-sol _site/palace-batch
          
          # Copy dist assets
          cp -r imperial-palace-opencode-516k/dist/* _site/opencode-516k/
          cp -r imperial-palace-opencode-424k/dist/* _site/opencode-424k/
          cp -r imperial-palace-commandcode-36m/dist/* _site/commandcode-36m/
          cp -r imperial-palace-dsh-1.1b/dist/* _site/dsh-1.1b/
          cp -r imperial-palace-gpt6luna/dist/* _site/gpt6luna/
          cp -r "imperial gemini 3.8flash"/dist/* _site/gemini-3.8flash/
          cp -r imperial-palace/luna/dist/* _site/imperial-palace/
          cp -r imperial-palace/luna/dist/* _site/gpt6-luna/
          cp -r imperial-palace/sol/dist/* _site/gpt6-sol/
          cp -r imperial-palace/sol/dist/* _site/palace-batch/
          
          # Copy portal homepage
          cp portal/index.html _site/index.html
          
          # Bypass Jekyll processing
          touch _site/.nojekyll
          
          echo "Multi-model showcase assembled successfully:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
