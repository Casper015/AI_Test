<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紫禁天朝 · 东方皇家宫殿 3D 沉浸式交互项目 (Gemini 3.8 Flash)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏯</text></svg>">
  <link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="scene-container"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-icon">🏯</div>
    <div>
      <div class="brand-title">紫禁天朝 · 东方皇家宫殿 3D</div>
      <div class="brand-badge">Gemini 3.8 Flash · 多 Agent 协同构建</div>
    </div>
  </header>

  <!-- View Presets Navigation Bar (Top Center) -->
  <nav class="view-nav"></nav>

  <!-- Top Right Utility Controls -->
  <div class="top-controls">
    <!-- Time Presets -->
    <div class="ctrl-group">
      <button class="btn-time active" data-preset="golden" title="盛世金辉 (正午光照)">☀️ 金辉</button>
      <button class="btn-time" data-preset="dusk" title="落霞残阳 (傍晚夕照)">🌅 落霞</button>
      <button class="btn-time" data-preset="night" title="寒月孤灯 (夜景宫灯)">🌙 月夜</button>
    </div>

    <!-- Mode Controls -->
    <div class="ctrl-group">
      <button class="btn-ctrl btn-fps" title="快捷键 F 切换第一人称">🚶 御前漫游 (F)</button>
      <button class="btn-ctrl btn-tour" title="开启中轴线经典导览">🧭 中轴导览</button>
    </div>

    <!-- Settings Controls -->
    <div class="ctrl-group">
      <button class="btn-ctrl btn-quality">高清画质</button>
      <button class="btn-ctrl btn-audio">🔇 静音</button>
      <button class="btn-ctrl btn-stats" title="显示帧率与网格统计">📊 性能</button>
    </div>
  </div>

  <!-- FPS Mode Operation Tip Banner -->
  <div class="fps-tip"></div>

  <!-- Performance Stats Board -->
  <div class="stats-board"></div>

  <!-- Interactive Minimap (Bottom Right) -->
  <aside class="minimap-container">
    <div class="minimap-title">
      <span>🗺️ 宫城全图雷达</span>
      <span style="font-size: 10px; color: var(--text-muted);">点击直达</span>
    </div>
    <canvas id="minimap-canvas" width="170" height="240"></canvas>
  </aside>

  <!-- Building Info Card (Bottom Left) -->
  <aside class="info-panel">
    <div class="info-header">
      <div>
        <div class="info-title">殿宇名</div>
        <div class="info-category">规制类别</div>
      </div>
      <button class="info-close" title="关闭">&times;</button>
    </div>
    <div class="info-access access-open">可进入游览</div>
    <div class="info-desc">建筑历史背景与功用详述。</div>
    <div class="info-actions"></div>
  </aside>

  <!-- Tour Narrative Subtitle Banner (Bottom Center) -->
  <div class="tour-subtitle">
    <span class="tour-badge">第 1 / 10 景</span>
    <h3 class="tour-title">导览景点</h3>
    <p class="tour-desc">讲解台词内容...</p>
    <div class="tour-controls">
      <button class="btn-action btn-tour-prev">⏮️ 上一景</button>
      <button class="btn-action btn-tour-pause">⏸️ 暂停</button>
      <button class="btn-action btn-tour-next">⏭️ 下一景</button>
      <button class="btn-action btn-gold btn-tour-exit">退出导览</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
