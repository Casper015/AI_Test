<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Mini Bike</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0ea5e9;
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  svg {
    width: min(100vw, 160vh);
    height: auto;
    max-height: 100vh;
    display: block;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, .35);
  }

  .spin-cw {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin-cw 0.4s linear infinite;
  }
  @keyframes spin-cw { to { transform: rotate(360deg); } }

  .rig {
    animation: bob 1.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .wing-near {
    transform-box: fill-box;
    transform-origin: 88% 78%;
    animation: flap-near 0.9s ease-in-out infinite;
  }
  .wing-far {
    transform-box: fill-box;
    transform-origin: 90% 80%;
    animation: flap-far 0.9s ease-in-out infinite;
  }
  @keyframes flap-near {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
  @keyframes flap-far {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
  }

  .beak {
    transform-box: fill-box;
    transform-origin: 4% 50%;
    animation: beak-bob 1.2s ease-in-out infinite;
  }
  @keyframes beak-bob {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(4deg); }
  }

  .pouch {
    transform-box: fill-box;
    transform-origin: 0% 0%;
    animation: pouch-wiggle 1.2s ease-in-out infinite;
  }
  @keyframes pouch-wiggle {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50% { transform: rotate(-5deg) scaleY(1.08); }
  }

  .eye-lid {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 3.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(0); }
    94%, 97% { transform: scaleY(1); }
  }

  .tail {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: tail-wag 0.6s ease-in-out infinite;
  }
  @keyframes tail-wag {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(8deg); }
  }

  .drift-slow { animation: drift 28s linear infinite; }
  .drift-mid  { animation: drift 14s linear infinite; }
  .drift-fast { animation: drift 7s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }

  .cloud-a { animation: cloud-x 40s linear infinite; }
  .cloud-b { animation: cloud-x 55s linear infinite; animation-delay: -20s; }
  .cloud-c { animation: cloud-x 48s linear infinite; animation-delay: -35s; }
  @keyframes cloud-x {
    from { transform: translateX(900px); }
    to   { transform: translateX(-250px); }
  }

  .sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin-cw 40s linear infinite;
  }

  .puff {
    animation: puff-out 0.9s ease-out infinite;
  }
  .puff-2 { animation-delay: 0.3s; }
  .puff-3 { animation-delay: 0.6s; }
  @keyframes puff-out {
    0%   { opacity: 0.7; transform: translate(0,0) scale(0.5); }
    100% { opacity: 0;   transform: translate(-46px,-18px) scale(1.4); }
  }

  .speed-line {
    animation: zip 0.7s linear infinite;
  }
  .speed-2 { animation-delay: 0.2s; }
  .speed-3 { animation-delay: 0.4s; }
  @keyframes zip {
    0%   { opacity: 0; transform: translateX(30px); }
    30%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateX(-70px); }
  }

  .flower-sway {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: sway 1.6s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Funny pelican riding a mini colorful bicycle, looping animation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="800" height="450" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sceneClip)">
    <!-- SKY -->
    <rect width="800" height="450" fill="url(#sky)"/>

    <!-- SUN -->
    <g transform="translate(672, 88)">
      <circle r="58" fill="url(#sunGlow)"/>
      <g class="sun-rays">
        <g fill="#fde047" opacity="0.9">
          <rect x="-3" y="-52" width="6" height="16" rx="3"/>
          <rect x="-3" y="36" width="6" height="16" rx="3"/>
          <rect x="-52" y="-3" width="16" height="6" rx="3"/>
          <rect x="36" y="-3" width="16" height="6" rx="3"/>
          <rect x="-3" y="-52" width="6" height="16" rx="3" transform="rotate(45)"/>
          <rect x="-3" y="36" width="6" height="16" rx="3" transform="rotate(45)"/>
          <rect x="-52" y="-3" width="16" height="6" rx="3" transform="rotate(45)"/>
          <rect x="36" y="-3" width="16" height="6" rx="3" transform="rotate(45)"/>
        </g>
      </g>
      <circle r="34" fill="#fde047"/>
      <circle r="34" fill="#fff7ed" opacity="0.35"/>
      <!-- smiley sun -->
      <circle cx="-10" cy="-4" r="3.2" fill="#f59e0b"/>
      <circle cx="10" cy="-4" r="3.2" fill="#f59e0b"/>
      <path d="M -12 10 Q 0 20 12 10" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CLOUDS -->
    <g fill="#ffffff" opacity="0.92">
      <g class="cloud-a" transform="translate(0,70)">
        <ellipse cx="0" cy="0" rx="36" ry="18"/>
        <ellipse cx="28" cy="4" rx="28" ry="14"/>
        <ellipse cx="-28" cy="5" rx="24" ry="13"/>
      </g>
      <g class="cloud-b" transform="translate(0,140)">
        <ellipse cx="0" cy="0" rx="30" ry="15"/>
        <ellipse cx="24" cy="3" rx="22" ry="12"/>
        <ellipse cx="-22" cy="4" rx="20" ry="11"/>
      </g>
      <g class="cloud-c" transform="translate(0,48)">
        <ellipse cx="0" cy="0" rx="24" ry="12"/>
        <ellipse cx="20" cy="2" rx="18" ry="10"/>
        <ellipse cx="-18" cy="3" rx="16" ry="9"/>
      </g>
    </g>

    <!-- FAR HILLS -->
    <g class="drift-slow">
      <g>
        <path d="M -20 340 Q 80 250 200 340 Z" fill="#86efac"/>
        <path d="M 160 340 Q 300 230 460 340 Z" fill="#6ee7b7"/>
        <path d="M 420 340 Q 560 255 720 340 Z" fill="#86efac"/>
        <path d="M 680 340 Q 780 270 880 340 Z" fill="#6ee7b7"/>
        <!-- duplicate for seamless loop -->
        <path d="M 780 340 Q 880 250 1000 340 Z" fill="#86efac"/>
        <path d="M 960 340 Q 1100 230 1260 340 Z" fill="#6ee7b7"/>
        <path d="M 1220 340 Q 1360 255 1520 340 Z" fill="#86efac"/>
        <path d="M 1480 340 Q 1580 270 1680 340 Z" fill="#6ee7b7"/>
      </g>
    </g>

    <!-- NEAR FIELD -->
    <g class="drift-mid">
      <g>
        <path d="M -20 385 Q 120 320 280 385 T 580 385 T 880 385 L 880 400 L -20 400 Z" fill="#4ade80"/>
        <path d="M 780 385 Q 920 320 1080 385 T 1380 385 T 1680 385 L 1680 400 L 780 400 Z" fill="#4ade80"/>
        <!-- trees -->
        <g transform="translate(90,318)">
          <rect x="-5" y="18" width="10" height="28" rx="3" fill="#92400e"/>
          <circle cy="10" r="26" fill="#16a34a"/>
          <circle cx="-16" cy="20" r="16" fill="#15803d"/>
          <circle cx="16" cy="18" r="15" fill="#16a34a"/>
        </g>
        <g transform="translate(520,325)">
          <rect x="-4" y="14" width="8" height="24" rx="3" fill="#92400e"/>
          <circle cy="6" r="22" fill="#22c55e"/>
          <circle cx="-14" cy="16" r="14" fill="#16a34a"/>
          <circle cx="14" cy="14" r="13" fill="#22c55e"/>
        </g>
        <g transform="translate(870,318)">
          <rect x="-5" y="18" width="10" height="28" rx="3" fill="#92400e"/>
          <circle cy="10" r="26" fill="#16a34a"/>
          <circle cx="-16" cy="20" r="16" fill="#15803d"/>
        </g>
        <g transform="translate(1320,325)">
          <rect x="-4" y="14" width="8" height="24" rx="3" fill="#92400e"/>
          <circle cy="6" r="22" fill="#22c55e"/>
          <circle cx="-14" cy="16" r="14" fill="#16a34a"/>
        </g>
      </g>
    </g>

    <!-- FLOWERS along roadside -->
    <g class="drift-fast">
      <g>
        <g class="flower-sway" transform="translate(40,372)">
          <line y2="12" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#f472b6"/><circle cy="-2" r="2" fill="#fde047"/>
        </g>
        <g class="flower-sway" style="animation-delay:-0.4s" transform="translate(170,374)">
          <line y2="10" stroke="#15803d" stroke-width="2"/>
          <circle cy="-1" r="5" fill="#c084fc"/><circle cy="-1" r="2" fill="#fde047"/>
        </g>
        <g class="flower-sway" style="animation-delay:-0.8s" transform="translate(310,371)">
          <line y2="12" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#fb7185"/><circle cy="-2" r="2" fill="#fde047"/>
        </g>
        <g class="flower-sway" style="animation-delay:-1.1s" transform="translate(600,373)">
          <line y2="11" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#fde047"/><circle cy="-2" r="2" fill="#f97316"/>
        </g>
        <g class="flower-sway" style="animation-delay:-0.2s" transform="translate(740,372)">
          <line y2="12" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#60a5fa"/><circle cy="-2" r="2" fill="#fde047"/>
        </g>
        <!-- duplicates -->
        <g class="flower-sway" transform="translate(840,372)">
          <line y2="12" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#f472b6"/><circle cy="-2" r="2" fill="#fde047"/>
        </g>
        <g class="flower-sway" style="animation-delay:-0.4s" transform="translate(970,374)">
          <line y2="10" stroke="#15803d" stroke-width="2"/>
          <circle cy="-1" r="5" fill="#c084fc"/><circle cy="-1" r="2" fill="#fde047"/>
        </g>
        <g class="flower-sway" style="animation-delay:-0.8s" transform="translate(1110,371)">
          <line y2="12" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#fb7185"/><circle cy="-2" r="2" fill="#fde047"/>
        </g>
        <g class="flower-sway" style="animation-delay:-1.1s" transform="translate(1400,373)">
          <line y2="11" stroke="#15803d" stroke-width="2"/>
          <circle cy="-2" r="5" fill="#fde047"/><circle cy="-2" r="2" fill="#f97316"/>
        </g>
      </g>
    </g>

    <!-- ROAD -->
    <rect x="0" y="383" width="800" height="67" fill="url(#road)"/>
    <rect x="0" y="383" width="800" height="4" fill="#94a3b8"/>
    <g class="drift-fast">
      <g fill="#fde047">
        <rect x="10"  y="416" width="46" height="7" rx="3"/>
        <rect x="110" y="416" width="46" height="7" rx="3"/>
        <rect x="210" y="416" width="46" height="7" rx="3"/>
        <rect x="310" y="416" width="46" height="7" rx="3"/>
        <rect x="410" y="416" width="46" height="7" rx="3"/>
        <rect x="510" y="416" width="46" height="7" rx="3"/>
        <rect x="610" y="416" width="46" height="7" rx="3"/>
        <rect x="710" y="416" width="46" height="7" rx="3"/>
        <rect x="810" y="416" width="46" height="7" rx="3"/>
        <rect x="910" y="416" width="46" height="7" rx="3"/>
        <rect x="1010" y="416" width="46" height="7" rx="3"/>
        <rect x="1110" y="416" width="46" height="7" rx="3"/>
        <rect x="1210" y="416" width="46" height="7" rx="3"/>
        <rect x="1310" y="416" width="46" height="7" rx="3"/>
        <rect x="1410" y="416" width="46" height="7" rx="3"/>
        <rect x="1510" y="416" width="46" height="7" rx="3"/>
      </g>
    </g>

    <!-- SPEED LINES -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55">
      <line class="speed-line" x1="250" y1="240" x2="300" y2="240"/>
      <line class="speed-line speed-2" x1="230" y1="290" x2="290" y2="290"/>
      <line class="speed-line speed-3" x1="255" y1="330" x2="305" y2="330"/>
    </g>

    <!-- ================= RIG ================= -->
    <g class="rig" id="rig">

      <!-- dust puffs behind rear wheel -->
      <g fill="#e2e8f0">
        <circle class="puff" cx="268" cy="378" r="7"/>
        <circle class="puff puff-2" cx="258" cy="382" r="6"/>
        <circle class="puff puff-3" cx="274" cy="384" r="5"/>
      </g>

      <!-- ===== FAR LEG (behind bike) ===== -->
      <g id="legFar" stroke="#ea580c" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path id="thighFar" stroke-width="14"/>
        <path id="shinFar" stroke-width="11"/>
      </g>
      <g id="footFar" fill="#ea580c" stroke="#9a3412" stroke-width="1.5" opacity="0.95">
        <path d="M -10 -7 Q 4 -11 20 -6 Q 26 -3 26 1 Q 26 5 18 7 Q 4 10 -10 7 Q -15 3 -15 0 Q -15 -4 -10 -7 Z"/>
        <path d="M 2 -6 L 4 7 M 10 -5 L 14 6 M 18 -4 L 21 5" stroke="#ea580c" stroke-width="1.4" fill="none"/>
      </g>
      <line id="crankFar" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

      <!-- ===== WHEELS ===== -->
      <!-- rear wheel -->
      <g>
        <g class="spin-cw">
          <circle cx="300" cy="345" r="38" fill="none" stroke="#1e293b" stroke-width="8"/>
          <circle cx="300" cy="345" r="34" fill="none" stroke="#38bdf8" stroke-width="3"/>
          <g stroke="#cbd5e1" stroke-width="2">
            <line x1="300" y1="313" x2="300" y2="377"/>
            <line x1="268" y1="345" x2="332" y2="345"/>
            <line x1="277" y1="322" x2="323" y2="368"/>
            <line x1="323" y1="322" x2="277" y2="368"/>
          </g>
          <circle cx="300" cy="345" r="7" fill="#f43f5e"/>
          <circle cx="300" cy="345" r="3" fill="#fff"/>
        </g>
        <!-- sprocket -->
        <g id="sprocketRear">
          <circle cx="300" cy="345" r="10" fill="none" stroke="#94a3b8" stroke-width="3"/>
          <circle cx="300" cy="345" r="4" fill="#64748b"/>
        </g>
      </g>

      <!-- front wheel -->
      <g class="spin-cw">
        <circle cx="500" cy="345" r="38" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="500" cy="345" r="34" fill="none" stroke="#f472b6" stroke-width="3"/>
        <g stroke="#cbd5e1" stroke-width="2">
          <line x1="500" y1="313" x2="500" y2="377"/>
          <line x1="468" y1="345" x2="532" y2="345"/>
          <line x1="477" y1="322" x2="523" y2="368"/>
          <line x1="523" y1="322" x2="477" y2="368"/>
        </g>
        <circle cx="500" cy="345" r="7" fill="#3b82f6"/>
        <circle cx="500" cy="345" r="3" fill="#fff"/>
      </g>

      <!-- chain -->
      <path d="M 300 337 L 400 336 M 300 353 L 400 354" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- chain rollers hint -->
      <g fill="#64748b">
        <circle cx="330" cy="336.5" r="2"/><circle cx="360" cy="336" r="2"/><circle cx="390" cy="336" r="2"/>
        <circle cx="330" cy="353.5" r="2"/><circle cx="360" cy="354" r="2"/><circle cx="390" cy="354" r="2"/>
      </g>

      <!-- ===== BIKE FRAME ===== -->
      <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" fill="none">
        <!-- seat tube -->
        <line x1="400" y1="345" x2="368" y2="272"/>
        <!-- chainstay -->
        <line x1="400" y1="345" x2="300" y2="345"/>
        <!-- top tube -->
        <line x1="368" y1="272" x2="468" y2="262"/>
        <!-- down tube -->
        <line x1="400" y1="345" x2="472" y2="268"/>
        <!-- fork -->
        <line x1="472" y1="265" x2="500" y2="345"/>
      </g>
      <!-- frame accent dots -->
      <g fill="#fde047" stroke="#f97316" stroke-width="2">
        <circle cx="400" cy="345" r="9"/>
      </g>

      <!-- seat -->
      <g>
        <line x1="368" y1="272" x2="366" y2="258" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
        <path d="M 344 256 Q 366 246 392 252 Q 394 260 378 262 L 350 262 Q 342 262 344 256 Z" fill="#7c3aed"/>
        <path d="M 348 256 Q 368 250 388 254" stroke="#a78bfa" stroke-width="2" fill="none"/>
      </g>

      <!-- handlebar -->
      <g stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round">
        <line x1="472" y1="268" x2="484" y2="246"/>
        <path d="M 484 246 Q 486 236 502 234"/>
      </g>
      <rect x="498" y="227" width="22" height="12" rx="5" fill="#ef4444" transform="rotate(-6 509 233)"/>
      <!-- bell -->
      <circle cx="480" cy="242" r="5" fill="#fde047" stroke="#f59e0b" stroke-width="1.5"/>

      <!-- ===== PELICAN BODY ===== -->
      <g id="pelican">
        <!-- tail feathers -->
        <g class="tail" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5">
          <path d="M 345 232 L 305 218 Q 312 234 302 246 Q 318 248 338 252 Z"/>
          <path d="M 345 244 L 312 252 Q 322 260 336 260 Z" fill="#f1f5f9"/>
        </g>

        <!-- far wing behind body -->
        <g class="wing-far" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2">
          <path d="M 390 210 Q 360 188 330 196 Q 318 204 332 214 Q 310 218 322 230 Q 345 244 390 238 Q 400 224 390 210 Z"/>
        </g>

        <!-- body -->
        <path d="M 338 236
                 Q 334 202 364 190
                 Q 396 180 422 202
                 Q 444 222 438 248
                 Q 432 276 396 282
                 Q 356 288 340 266
                 Q 330 252 338 236 Z"
              fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
        <!-- belly shade -->
        <path d="M 352 268 Q 380 284 420 266 Q 410 284 384 286 Q 360 286 352 268 Z" fill="#f8fafc" opacity="0.8"/>

        <!-- neck -->
        <path d="M 408 210
                 Q 436 198 438 168
                 Q 440 144 448 130"
              fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
        <path d="M 412 214
                 Q 438 202 440 172
                 Q 442 148 450 134"
              fill="none" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round" opacity="0.45"/>

        <!-- head + beak raised for clearance -->
        <g transform="translate(-4 -18)">
        <!-- head -->
        <ellipse cx="446" cy="144" rx="24" ry="21" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <!-- cheek blush -->
        <ellipse cx="438" cy="154" rx="7" ry="4" fill="#fda4af" opacity="0.65"/>

        <!-- BEAK (open, big orange) -->
        <g class="beak">
          <!-- mouth interior -->
          <path d="M 462 142 L 560 138 Q 568 152 556 168 L 462 160 Z" fill="#9f1239"/>
          <!-- tongue -->
          <ellipse cx="505" cy="158" rx="26" ry="7" fill="#fb7185"/>
          <!-- upper mandible -->
          <path d="M 458 138
                   Q 500 118 556 124
                   Q 578 128 574 138
                   Q 560 148 520 148
                   L 460 148 Z"
                fill="url(#beakTop)" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
          <!-- upper ridge -->
          <path d="M 470 134 Q 520 122 560 130" stroke="#fdba74" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
          <!-- nostril -->
          <ellipse cx="478" cy="132" rx="4" ry="2.5" fill="#c2410c" opacity="0.7"/>
          <!-- lower pouch -->
          <g class="pouch">
            <path d="M 458 158
                     Q 500 156 548 164
                     Q 572 172 562 190
                     Q 540 212 494 206
                     Q 462 200 454 178
                     Q 452 164 458 158 Z"
                  fill="#fb923c" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 470 170 Q 510 178 548 176" stroke="#fdba74" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
          </g>
        </g>

        <!-- eye -->
        <circle cx="442" cy="138" r="7.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="444" cy="139" r="4.5" fill="#0f172a"/>
        <circle cx="446" cy="137" r="1.6" fill="#ffffff"/>
        <rect class="eye-lid" x="435" y="130" width="16" height="16" fill="#ffffff" style="transform-origin: center;"/>

        <!-- brow (silly) -->

        <!-- near wing (spread for balance) -->
        <g class="wing-near">
          <path d="M 375 208
                   Q 340 178 300 178
                   Q 278 182 288 198

                   Q 254 224 274 238
                   Q 300 254 360 246
                   Q 386 232 375 208 Z"
                fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 350 214 Q 320 200 300 196 M 355 226 Q 325 222 296 220 M 355 236 Q 330 240 300 236"
                stroke="#e2e8f0" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- ===== NEAR LEG (in front of frame) ===== -->
      <g id="legNear" stroke="#f97316" fill="none" stroke-linecap="round" stroke-linejoin="round">

      <!-- knee cap highlight -->
      <circle id="kneeNear" r="6.5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
      <!-- hip cap -->
      <circle cx="382" cy="254" r="8" fill="#fdba74" stroke="#f97316" stroke-width="1.5" opacity="0.9"/>

      <!-- near crank arm -->
      <line id="crankNear" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <!-- chainring -->
      <g id="chainring">
        <circle cx="400" cy="345" r="16" fill="none" stroke="#fde047" stroke-width="4"/>

          <line x1="400" y1="331" x2="400" y2="359"/>
          <line x1="386" y1="345" x2="414" y2="345"/>

        <circle cx="400" cy="345" r="5" fill="#f97316" stroke="#ea580c" stroke-width="2"/>

      <rect id="pedalNear" x="-12" y="-3.5" width="24" height="7" rx="2.5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>

      <g id="footNear" fill="#f97316" stroke="#c2410c" stroke-width="2">

        <path d="M 22 -7 Q 28 -10 30 -6 M 26 1 Q 32 0 30 5 M 20 8 Q 24 12 28 9"

<script>
(function () {
  const CRANK = { x: 400, y: 345 };
  const PEDAL_R = 17;
  const HIP_NEAR = { x: 382, y: 254 };
  const HIP_FAR  = { x: 372, y: 250 };
  const L1 = 56, L2 = 62;
  const CRANK_PERIOD = 1200; // ms per pedal rev

  const thighNear = document.getElementById('thighNear');
  const shinNear  = document.getElementById('shinNear');
  const thighFar  = document.getElementById('thighFar');
  const shinFar   = document.getElementById('shinFar');
  const kneeNear  = document.getElementById('kneeNear');
  const footNear  = document.getElementById('footNear');
  const footFar   = document.getElementById('footFar');
  const crankNear = document.getElementById('crankNear');
  const crankFar  = document.getElementById('crankFar');
  const chainring = document.getElementById('chainring');
  const pedalNear = document.getElementById('pedalNear');

  function solveIK(hip, foot) {
    let dx = foot.x - hip.x;
    let dy = foot.y - hip.y;
    let dist = Math.hypot(dx, dy) || 0.0001;
    const dMin = Math.abs(L1 - L2) + 2;
    const dMax = L1 + L2 - 2;
    let clamped = false;
    let d = dist;
    if (d > dMax) { d = dMax; clamped = true; }
    if (d < dMin) { d = dMin; clamped = true; }

    const ux = dx / dist, uy = dy / dist;
    const fx = hip.x + ux * d;
    const fy = hip.y + uy * d;

    const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const base = Math.atan2(fy - hip.y, fx - hip.x);
    const kneeAng = base - a;

    const knee = {
      x: hip.x + L1 * Math.cos(kneeAng),
      y: hip.y + L1 * Math.sin(kneeAng)
    };
    return { knee, foot: { x: fx, y: fy } };
  }

  function setLeg(thighEl, shinEl, hip, knee, foot) {
    thighEl.setAttribute('d', `M ${hip.x} ${hip.y} L ${knee.x} ${knee.y}`);
    shinEl.setAttribute('d', `M ${knee.x} ${knee.y} L ${foot.x} ${foot.y}`);
  }

  function setFoot(footEl, x, y, ang) {
    footEl.setAttribute('transform', `translate(${x} ${y}) rotate(${ang})`);
  }

  let start = performance.now();

  function frame(now) {
    const theta = (2 * Math.PI * (now - start) / CRANK_PERIOD);

    const footR = {
      x: CRANK.x + PEDAL_R * Math.cos(theta),
      y: CRANK.y + PEDAL_R * Math.sin(theta)
    };
    const footL = {
      x: CRANK.x + PEDAL_R * Math.cos(theta + Math.PI),
      y: CRANK.y + PEDAL_R * Math.sin(theta + Math.PI)
    };

    const near = solveIK(HIP_NEAR, footR);
    const far  = solveIK(HIP_FAR, footL);

    setLeg(thighNear, shinNear, HIP_NEAR, near.knee, near.foot);
    setLeg(thighFar,  shinFar,  HIP_FAR,  far.knee,  far.foot);

    kneeNear.setAttribute('cx', near.knee.x);
    kneeNear.setAttribute('cy', near.knee.y);

    const angNear = Math.atan2(near.foot.y - near.knee.y, near.foot.x - near.knee.x) * 180 / Math.PI;
    const angFar  = Math.atan2(far.foot.y - far.knee.y, far.foot.x - far.knee.x) * 180 / Math.PI;

    setFoot(footNear, near.foot.x, near.foot.y + 2, angNear * 0.35);
    setFoot(footFar,  far.foot.x,  far.foot.y + 2,  angFar * 0.35);

    pedalNear.setAttribute('transform', `translate(${near.foot.x} ${near.foot.y + 6})`);

    crankNear.setAttribute('x1', CRANK.x);
    crankNear.setAttribute('y1', CRANK.y);
    crankNear.setAttribute('x2', near.foot.x);
    crankNear.setAttribute('y2', near.foot.y);

    crankFar.setAttribute('x1', CRANK.x);
    crankFar.setAttribute('y1', CRANK.y);
    crankFar.setAttribute('x2', far.foot.x);
    crankFar.setAttribute('y2', far.foot.y);

    const deg = theta * 180 / Math.PI;
    chainring.setAttribute('transform', `rotate(${deg} 400 345)`);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
