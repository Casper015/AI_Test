<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑单车的鹈鹕 · 流畅矢量动画</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(130% 120% at 50% 0%, #1b3050 0%, #090d16 72%);
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage { width: min(94vw, 1000px); }
  svg { display: block; width: 100%; height: auto; border-radius: 22px;
        box-shadow: 0 34px 84px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只滑稽可爱的鹈鹕骑着彩色迷你自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79dcff"/>
      <stop offset=".55" stop-color="#c4f1ff"/>
      <stop offset="1" stop-color="#eafdff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe680" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f3"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0" stop-color="#ffc300"/>
      <stop offset="1" stop-color="#f77f00"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffca4d"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ce99a"/>
      <stop offset="1" stop-color="#37b24d"/>
    </linearGradient>
    <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b2f2bb"/>
      <stop offset="1" stop-color="#63d97b"/>
    </linearGradient>
    <pattern id="roadPat" width="340" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="142" height="16" rx="8" fill="#ffffff" opacity=".7"/>
    </pattern>
    <g id="spokeT"><line x1="0" y1="-6" x2="0" y2="-45"/></g>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="800" height="520" fill="url(#sky)"/>

  <g id="sun">
    <circle cx="690" cy="74" r="126" fill="url(#sunGlow)"/>
    <g id="sunRays" transform="translate(690,74)" stroke="#ffd93d" stroke-width="6"
       stroke-linecap="round" opacity=".55">
      <line x1="0" y1="-70" x2="0" y2="-86"/>
      <line x1="0" y1="70" x2="0" y2="86"/>
      <line x1="-70" y1="0" x2="-86" y2="0"/>
      <line x1="70" y1="0" x2="86" y2="0"/>
      <line x1="-50" y1="-50" x2="-61" y2="-61"/>
      <line x1="50" y1="-50" x2="61" y2="-61"/>
      <line x1="-50" y1="50" x2="-61" y2="61"/>
      <line x1="50" y1="50" x2="61" y2="61"/>
    </g>
    <circle cx="690" cy="74" r="44" fill="#ffd93d"/>
  </g>

  <g id="clouds" fill="#f3fbff">
    <g id="cloud1" opacity=".95">
      <ellipse cx="0" cy="0" rx="46" ry="26"/>
      <ellipse cx="38" cy="9" rx="34" ry="19"/>
      <ellipse cx="-32" cy="10" rx="28" ry="16"/>
    </g>
    <g id="cloud2" opacity=".85">
      <ellipse cx="0" cy="0" rx="38" ry="22"/>
      <ellipse cx="30" cy="8" rx="28" ry="15"/>
      <ellipse cx="-26" cy="8" rx="22" ry="13"/>
    </g>
    <g id="cloud3" opacity=".75">
      <ellipse cx="0" cy="0" rx="54" ry="24"/>
      <ellipse cx="44" cy="6" rx="32" ry="16"/>
      <ellipse cx="-40" cy="8" rx="26" ry="14"/>
    </g>
  </g>

  <g>
    <path d="M-20 428 Q 120 336 300 428 Z" fill="url(#hillG)"/>
    <path d="M240 428 Q 420 318 626 428 Z" fill="url(#hillG)" opacity=".85"/>
    <path d="M516 428 Q 662 352 826 428 Z" fill="url(#hillG)"/>
  </g>

  <rect y="428" width="800" height="92" fill="url(#groundG)"/>
  <rect id="road" y="470" width="800" height="16" fill="url(#roadPat)"/>

  <g id="grass" stroke="#2f9e44" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".5">
    <path d="M54 430 q -5 -15 -12 -22"/><path d="M61 430 q 2 -17 11 -24"/>
    <path d="M196 430 q -5 -14 -12 -20"/><path d="M202 431 q 3 -16 12 -22"/>
    <path d="M690 430 q -5 -15 -12 -22"/><path d="M697 430 q 2 -17 11 -24"/>
    <path d="M768 431 q -5 -14 -12 -20"/><path d="M775 430 q 3 -16 12 -22"/>
  </g>

  <g id="streaks"></g>

  <!-- ===== 单车 + 鹈鹕 ===== -->
  <g id="rig">
    <ellipse cx="428" cy="429" rx="150" ry="11" fill="#2b8a3e" opacity=".22"/>

    <!-- 远侧腿 -->
    <g id="farLeg">
      <path id="farLegO" fill="none" stroke="#d9480f" stroke-width="19"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path id="farLegF" fill="none" stroke="#f0862f" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="footFar">
      <path d="M-15 -10 C -20 -3 -19 4 -13 7 L -6 8 L -1 3 L 4 8 L 9 8 L 14 3 L 19 7
               C 23 4 24 -3 21 -7 C 16 -12 2 -13 -7 -12 C -11 -12 -14 -11 -15 -10 Z"
            fill="#f0862f" stroke="#d9480f" stroke-width="2.6" stroke-linejoin="round"/>
    </g>

    <!-- 自行车 -->
    <g id="bike">
      <!-- 后轮 -->
      <g id="rearWheel" transform="translate(300,376)">
        <circle r="52" fill="#f4f7fb" stroke="#2b2d42" stroke-width="9"/>
        <circle r="42" fill="none" stroke="#4dd0e1" stroke-width="3.5"/>
        <g id="rearSpokes" stroke="#9aa8bb" stroke-width="2.4" stroke-linecap="round">
          <use href="#spokeT"/><use href="#spokeT" transform="rotate(45)"/>
          <use href="#spokeT" transform="rotate(90)"/><use href="#spokeT" transform="rotate(135)"/>
          <use href="#spokeT" transform="rotate(180)"/><use href="#spokeT" transform="rotate(225)"/>
          <use href="#spokeT" transform="rotate(270)"/><use href="#spokeT" transform="rotate(315)"/>
        </g>
        <circle r="8" fill="#2b2d42"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke-width="10" stroke-linecap="round">
        <path d="M300 376 L424 372" stroke="#845ef7"/>
        <path d="M300 376 L374 274" stroke="#ffa94d"/>
        <path d="M424 372 L378 274" stroke="#ffd43b"/>
        <path d="M374 272 L536 264" stroke="#ff6b6b"/>
        <path d="M424 372 L544 298" stroke="#4dd0e1"/>
        <path d="M534 262 L546 300" stroke="#ff6b6b" stroke-width="12"/>
        <path d="M546 300 L548 376" stroke="#4dd0e1"/>
      </g>

      <!-- 座椅 -->
      <g transform="rotate(-5 374 276)">
        <rect x="336" y="269" width="76" height="14" rx="7" fill="#4dd0e1" stroke="#22b8cf" stroke-width="2.5"/>
      </g>

      <!-- 车把 -->
      <g stroke="#22b8cf" stroke-width="9" fill="none" stroke-linecap="round">
        <path d="M534 262 L528 242"/>
        <path d="M504 240 Q 532 234 562 250"/>
      </g>
      <circle cx="504" cy="240" r="7" fill="#2b2d42"/>
      <circle cx="562" cy="250" r="7" fill="#2b2d42"/>

      <!-- 彩带 -->
      <g id="ribbons" fill="none" stroke-width="5" stroke-linecap="round">
        <path d="M502 238 C 486 230 470 242 452 232" stroke="#ff6b6b"/>
        <path d="M502 240 C 486 236 472 248 454 244" stroke="#ffd43b"/>
        <path d="M502 242 C 486 242 472 254 456 256" stroke="#845ef7"/>
      </g>

      <!-- 曲柄 / 脚踏 -->
      <g>
        <line id="crankFar" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
        <circle cx="424" cy="372" r="15" fill="none" stroke="#ffd43b" stroke-width="4"/>
        <circle cx="424" cy="372" r="7" fill="#2b2d42"/>
        <rect id="pedFar" x="-16" y="-5" width="32" height="10" rx="4" fill="#495057"/>
        <line id="crankNear" stroke="#2b2d42" stroke-width="7" stroke-linecap="round"/>
        <rect id="pedNear" x="-16" y="-5" width="32" height="10" rx="4" fill="#2b2d42"/>
      </g>

      <!-- 前轮 -->
      <g id="frontWheel" transform="translate(548,376)">
        <circle r="52" fill="#f4f7fb" stroke="#2b2d42" stroke-width="9"/>
        <circle r="42" fill="none" stroke="#ff6b6b" stroke-width="3.5"/>
        <g id="frontSpokes" stroke="#9aa8bb" stroke-width="2.4" stroke-linecap="round">
          <use href="#spokeT"/><use href="#spokeT" transform="rotate(45)"/>
          <use href="#spokeT" transform="rotate(90)"/><use href="#spokeT" transform="rotate(135)"/>
          <use href="#spokeT" transform="rotate(180)"/><use href="#spokeT" transform="rotate(225)"/>
          <use href="#spokeT" transform="rotate(270)"/><use href="#spokeT" transform="rotate(315)"/>
        </g>
        <circle r="8" fill="#2b2d42"/>
      </g>
    </g>

    <!-- 近侧腿 -->
    <g id="nearLeg">
      <path id="nearLegO" fill="none" stroke="#e8590c" stroke-width="20"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearLegF" fill="none" stroke="#ffa94d" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="footNear">
      <path d="M-15 -10 C -20 -3 -19 4 -13 7 L -6 8 L -1 3 L 4 8 L 9 8 L 14 3 L 19 7
               C 23 4 24 -3 21 -7 C 16 -12 2 -13 -7 -12 C -11 -12 -14 -11 -15 -10 Z"
            fill="#ffa94d" stroke="#e8590c" stroke-width="2.6" stroke-linejoin="round"/>
    </g>

    <!-- 身体 -->
    <g id="torso">
      <g id="farWing" transform="translate(338,172) scale(.78)">
        <path d="M4 -8 C -24 -20 -84 -18 -118 6 C -124 16 -116 26 -102 30
                 C -108 40 -92 45 -74 42 C -52 44 -26 40 -8 30 C 8 22 10 6 4 -8 Z"
              fill="#d6e2f0" stroke="#bccde1" stroke-width="3" stroke-linejoin="round"/>
      </g>

      <!-- 脖子（画在身体之前，根部被身体遮住，衔接自然） -->
      <path d="M372 170 C 398 150 378 122 400 98" fill="none" stroke="#c9d6e4"
            stroke-width="40" stroke-linecap="round"/>
      <path d="M372 170 C 398 150 378 122 400 98" fill="none" stroke="url(#bodyG)"
            stroke-width="34" stroke-linecap="round"/>

      <path d="M320 186 C 292 170 258 166 236 176 C 256 196 292 208 322 200 Z"
            fill="#eaf1f8" stroke="#c9d6e4" stroke-width="2.5" stroke-linejoin="round"/>

      <ellipse cx="378" cy="204" rx="76" ry="61" fill="url(#bodyG)"
               stroke="#c9d6e4" stroke-width="2.5"/>
      <path d="M332 238 C 358 260 410 260 434 238" fill="none" stroke="#eef4fb"
            stroke-width="7" stroke-linecap="round" opacity=".9"/>

      <g id="nearWing" transform="translate(392,168)">
        <path d="M4 -8 C -24 -20 -84 -18 -118 6 C -124 16 -116 26 -102 30
                 C -108 40 -92 45 -74 42 C -52 44 -26 40 -8 30 C 8 22 10 6 4 -8 Z"
              fill="url(#bodyG)" stroke="#c9d6e4" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M-102 10 C -86 24 -56 34 -26 32" fill="none" stroke="#d4e0ee"
              stroke-width="3" stroke-linecap="round"/>
        <path d="M-94 24 C -74 36 -46 42 -20 40" fill="none" stroke="#d4e0ee"
              stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 头 -->
      <g id="headGrp">
        <circle cx="402" cy="90" r="36" fill="url(#bodyG)" stroke="#c9d6e4" stroke-width="2.5"/>
        <ellipse cx="374" cy="110" rx="12" ry="8" fill="#ffb3c1" opacity=".5"/>
        <path d="M390 56 C 398 46 412 44 422 50" fill="none" stroke="#d4e0ee"
              stroke-width="6" stroke-linecap="round"/>

        <path d="M428 74 C 474 72 526 82 560 102 L 560 110 C 526 94 474 88 428 92 Z"
              fill="url(#beakG)" stroke="#e8590c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M440 81 C 480 80 520 88 550 102" fill="none" stroke="#ffd97d"
              stroke-width="3" stroke-linecap="round" opacity=".85"/>
        <ellipse cx="448" cy="83" rx="4" ry="2.4" fill="#e8590c" opacity=".5"/>

        <g id="pouch">
          <path d="M428 94 C 476 98 526 105 560 110 C 550 134 512 158 470 158
                   C 444 158 430 136 428 94 Z"
                fill="url(#pouchG)" stroke="#e8590c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M456 110 C 470 132 496 140 520 134" fill="none" stroke="#ffdc8a"
                stroke-width="3.5" stroke-linecap="round" opacity=".85"/>
        </g>

        <path d="M404 62 C 410 55 422 54 429 60" fill="none" stroke="#2b2d42"
              stroke-width="3.4" stroke-linecap="round"/>
        <g id="eye" transform="translate(416,80)">
          <circle r="10.5" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/>
          <circle cx="2.5" cy="1" r="6" fill="#2b2d42"/>
          <circle cx="4.6" cy="-1.4" r="2.2" fill="#ffffff"/>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);

  const BB = { x: 424, y: 372 }, CR = 22;
  const HIPS = [{ x: 368, y: 256 }, { x: 388, y: 258 }];
  const L1 = 76, L2 = 74;
  const CAD = 2.35, GEAR = 2.6, WR = 52;

  const el = {
    farLegO: $('farLegO'), farLegF: $('farLegF'),
    nearLegO: $('nearLegO'), nearLegF: $('nearLegF'),
    footFar: $('footFar'), footNear: $('footNear'),
    crankFar: $('crankFar'), crankNear: $('crankNear'),
    pedFar: $('pedFar'), pedNear: $('pedNear'),
    rearSpokes: $('rearSpokes'), frontSpokes: $('frontSpokes'),
    torso: $('torso'), nearWing: $('nearWing'), farWing: $('farWing'),
    headGrp: $('headGrp'), pouch: $('pouch'), eye: $('eye'),
    road: $('road'), sunRays: $('sunRays'), rig: $('rig'),
    ribbons: $('ribbons').children,
    streaks: $('streaks')
  };

  // ---- 速度线 ----
  const streakData = [
    { y: 292, w: 40, sp: 520, ph: 0.05 },
    { y: 322, w: 60, sp: 610, ph: 0.40 },
    { y: 352, w: 30, sp: 470, ph: 0.72 },
    { y: 392, w: 52, sp: 640, ph: 0.18 },
    { y: 414, w: 68, sp: 560, ph: 0.58 }
  ];
  const streaks = streakData.map(s => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', 0); r.setAttribute('y', -3);
    r.setAttribute('width', s.w); r.setAttribute('height', 6);
    r.setAttribute('rx', 3); r.setAttribute('fill', '#ffffff');
    el.streaks.appendChild(r);
    return { ...s, el: r };
  });

  // ---- 云 ----
  const clouds = [
    { el: $('cloud1'), x0: 60,  y: 92,  sp: 14 },
    { el: $('cloud2'), x0: 420, y: 152, sp: 9  },
    { el: $('cloud3'), x0: 700, y: 62,  sp: 18 }
  ];

  // ---- 两骨骼 IK：让带蹼的脚稳稳踩在脚踏上 ----
  function ik(hip, target) {
    const dx = target.x - hip.x, dy = target.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(L1 - L2) + 0.01, Math.min(L1 + L2 - 0.01, d));
    const a = Math.atan2(dy, dx);
    const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const A = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ang = a - A;
    return {
      knee: { x: hip.x + Math.cos(ang) * L1, y: hip.y + Math.sin(ang) * L1 },
      ankle: { x: hip.x + Math.cos(a) * d, y: hip.y + Math.sin(a) * d }
    };
  }

  function setLeg(o, f, hip, target) {
    const r = ik(hip, target);
    const d = 'M' + hip.x.toFixed(1) + ' ' + hip.y.toFixed(1) +
              'L' + r.knee.x.toFixed(1) + ' ' + r.knee.y.toFixed(1) +
              'L' + r.ankle.x.toFixed(1) + ' ' + r.ankle.y.toFixed(1);
    o.setAttribute('d', d);
    f.setAttribute('d', d);
  }

  const place = (node, x, y, deg) =>
    node.setAttribute('transform',
      'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + deg.toFixed(2) + ')');

  let theta = 0, roadOff = 0, last = performance.now(), t0 = last;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = (now - t0) / 1000;
    theta += CAD * dt;

    const bob = 2.4 * Math.sin(2 * theta);
    const ct = Math.cos(theta), st = Math.sin(theta);
    const pNear = { x: BB.x + CR * ct, y: BB.y + CR * st };
    const pFar  = { x: BB.x - CR * ct, y: BB.y - CR * st };

    // 腿 + 脚
    setLeg(el.farLegO, el.farLegF, { x: HIPS[0].x, y: HIPS[0].y + bob }, pFar);
    setLeg(el.nearLegO, el.nearLegF, { x: HIPS[1].x, y: HIPS[1].y + bob }, pNear);
    place(el.footFar, pFar.x, pFar.y - 8, 7 * Math.sin(theta + 1.57));
    place(el.footNear, pNear.x, pNear.y - 8, 7 * Math.sin(theta));

    // 曲柄 / 脚踏
    el.crankFar.setAttribute('x1', BB.x);  el.crankFar.setAttribute('y1', BB.y);
    el.crankFar.setAttribute('x2', pFar.x.toFixed(1));  el.crankFar.setAttribute('y2', pFar.y.toFixed(1));
    el.crankNear.setAttribute('x1', BB.x); el.crankNear.setAttribute('y1', BB.y);
    el.crankNear.setAttribute('x2', pNear.x.toFixed(1)); el.crankNear.setAttribute('y2', pNear.y.toFixed(1));
    place(el.pedFar, pFar.x, pFar.y, 0);
    place(el.pedNear, pNear.x, pNear.y, 0);

    // 车轮滚动
    const deg = theta * GEAR * 180 / Math.PI;
    el.rearSpokes.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ')');
    el.frontSpokes.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ')');

    // 车身轻微左右摇摆
    el.rig.setAttribute('transform',
      'rotate(' + (0.9 * Math.sin(theta + 0.4)).toFixed(2) + ',430,428)');

    // 身体起伏 + 翅膀
    el.torso.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');
    const flap = 5 * Math.sin(2 * theta);
    el.nearWing.setAttribute('transform',
      'translate(392,168) rotate(' + (-1 + flap).toFixed(2) + ')');
    el.farWing.setAttribute('transform',
      'translate(340,166) scale(.78) rotate(' + (-2 - flap * 0.6).toFixed(2) + ')');

    // 头 / 喉囊 / 眨眼
    el.headGrp.setAttribute('transform',
      'rotate(' + (2.4 * Math.sin(2 * theta + 1.1)).toFixed(2) + ',402,90)');
    el.pouch.setAttribute('transform',
      'rotate(' + (3.2 * Math.sin(2 * theta + 0.6)).toFixed(2) + ',428,94)');
    const bt = time % 3.6;
    el.eye.setAttribute('transform',
      'translate(416,80) scale(1,' + (bt < 0.13 ? 0.1 : 1) + ')');

    // 车把彩带飘动
    for (let i = 0; i < el.ribbons.length; i++) {
      el.ribbons[i].setAttribute('transform',
        'rotate(' + (Math.sin(2 * theta + i * 0.9) * 15).toFixed(2) + ',502,240)');
    }

    // 路面滚动
    roadOff = (roadOff + WR * CAD * GEAR * dt) % 340;
    el.road.setAttribute('patternTransform', 'translate(' + (-roadOff).toFixed(1) + ',0)');

    // 速度线
    for (const s of streaks) {
      const p = (time * s.sp / 430 + s.ph) % 1;
      s.el.setAttribute('transform',
        'translate(' + (268 - p * 440).toFixed(1) + ',' + s.y + ')');
      s.el.setAttribute('opacity', (Math.sin(Math.PI * p) * 0.6).toFixed(3));
    }

    // 云朵 & 太阳
    for (const c of clouds) {
      const x = ((c.x0 + time * c.sp) % 1000 + 1000) % 1000 - 150;
      c.el.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + c.y + ')');
    }
    el.sunRays.setAttribute('transform',
      'translate(690,74) rotate(' + (time * 12 % 360).toFixed(2) + ')');

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
