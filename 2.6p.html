<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑迷你自行车 · 2D 矢量动画</title>
<style>
  :root {
    --page-bg: #eef6ff;
    --ink: #2b2d42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(1200px 700px at 50% 20%, #ffffff 0%, var(--page-bg) 55%, #dcecff 100%);
    font-family: "Avenir Next", "PingFang SC", "Segoe UI", sans-serif;
    color: var(--ink);
    overflow: hidden;
    padding: 16px;
  }
  main { width: min(1100px, 100%); }
  svg#stage {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 28px;
    box-shadow:
      0 30px 60px rgba(43, 45, 66, 0.14),
      0 2px 0 rgba(255, 255, 255, 0.8) inset;
    background: #b9e6ff;
    touch-action: none;
    user-select: none;
  }
</style>
</head>
<body>
<main>
  <!-- Motion study: looping 2D vector scene — cute pelican pedaling a mini colorful bicycle. -->

      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

        <stop offset="100%" stop-color="#eaf9ff" />

      <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7ed07a" />
        <stop offset="100%" stop-color="#4faf5c" />
      </linearGradient>
      <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f0d9a8" />
        <stop offset="100%" stop-color="#dfc08a" />
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">

        <stop offset="100%" stop-color="#ff9f43" />

      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff7a7a" />
        <stop offset="100%" stop-color="#ff4d6d" />
      </linearGradient>
      <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe66d" />
        <stop offset="100%" stop-color="#ffd23f" />
      </linearGradient>

      <clipPath id="stageClip">
        <rect x="0" y="0" width="1000" height="640" rx="28" ry="28" />

      <g id="cloudShape">

<script>
(function () {
  "use strict";

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  const BB = { x: 488, y: 495 };
  const CRANK_LEN = 28;
  const HIP_NEAR = { x: 462, y: 388 };
  const HIP_FAR  = { x: 450, y: 380 };
  const THIGH = 74;
  const SHIN  = 74;
  const WHEEL_R = 48;

  const WHEEL_SPEED = (Math.PI * 2) / 0.85;
  const CRANK_SPEED = WHEEL_SPEED * 0.62;
  const GROUND_SPEED = WHEEL_SPEED * WHEEL_R;

  const el = {
    bobGroup: document.getElementById("bobGroup"),
    shadowG: document.getElementById("shadowG"),
    wheelRearSpin: document.getElementById("wheelRearSpin"),
    wheelFrontSpin: document.getElementById("wheelFrontSpin"),
    crankFarArm: document.getElementById("crankFarArm"),
    crankNearArm: document.getElementById("crankNearArm"),
    pedalFar: document.getElementById("pedalFar"),
    pedalNear: document.getElementById("pedalNear"),
    legFar: document.getElementById("legFar"),
    legNear: document.getElementById("legNear"),
    footFar: document.getElementById("footFar"),
    footNear: document.getElementById("footNear"),
    wingFar: document.getElementById("wingFar"),
    wingNear: document.getElementById("wingNear"),
    tail: document.getElementById("tail"),
    head: document.getElementById("head"),
    pouch: document.getElementById("pouch"),
    fishTail: document.getElementById("fishTail"),
    eyelid: document.getElementById("eyelid"),
    clouds: document.getElementById("clouds"),
    hillsFar: document.getElementById("hillsFar"),
    hillsN: document.getElementById("hillsN"),
    pathDashes: document.getElementById("pathDashes"),
    groundBits: document.getElementById("groundBits"),
    pebbles: document.getElementById("pebbles"),
    speedLines: document.getElementById("speedLines"),
    streamer1: document.getElementById("streamer1"),
    streamer2: document.getElementById("streamer2"),
    streamer3: document.getElementById("streamer3"),
    card: document.getElementById("card"),
  };

  const WING_NEAR_PIVOT = { x: 458, y: 318 };
  const WING_FAR_PIVOT  = { x: 462, y: 318 };
  const TAIL_PIVOT = { x: 392, y: 338 };
  const HEAD_PIVOT = { x: 505, y: 288 };

  function ik(hx, hy, ax, ay, l1, l2, bendSign) {
    let dx = ax - hx, dy = ay - hy;
    let d = Math.hypot(dx, dy) || 0.001;
    const maxD = l1 + l2 - 0.5;
    if (d > maxD) {
      const s = maxD / d;
      dx *= s; dy *= s; d = maxD;
      ax = hx + dx; ay = hy + dy;
    }
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = hx + (dx * a) / d;
    const my = hy + (dy * a) / d;
    const nx = (-dy / d) * bendSign;
    const ny = (dx / d) * bendSign;
    return { kx: mx + nx * h, ky: my + ny * h, ax: ax, ay: ay };
  }

  function setTransform(node, x, y, rotDeg, sx, sy) {
    sx = sx == null ? 1 : sx;
    sy = sy == null ? sx : sy;
    node.setAttribute(
      "transform",
      "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + rotDeg.toFixed(2) + ") scale(" + sx.toFixed(3) + " " + sy.toFixed(3) + ")"
    );
  }

  function bindPivot(node, pivot) { node._pivot = pivot; }
  bindPivot(el.wingNear, WING_NEAR_PIVOT);
  bindPivot(el.wingFar, WING_FAR_PIVOT);
  bindPivot(el.tail, TAIL_PIVOT);
  bindPivot(el.head, HEAD_PIVOT);

  function setPivotRotation(node, rotDeg, dx, dy, sx, sy) {
    const p = node._pivot;
    sx = sx == null ? 1 : sx;
    sy = sy == null ? sx : sy;
    dx = dx || 0; dy = dy || 0;
    node.setAttribute(
      "transform",
      "translate(" + (p.x + dx).toFixed(2) + " " + (p.y + dy).toFixed(2) + ") " +
      "rotate(" + rotDeg.toFixed(2) + ") " +
      "scale(" + sx.toFixed(3) + " " + sy.toFixed(3) + ") " +
      "translate(" + (-p.x).toFixed(2) + " " + (-p.y).toFixed(2) + ")"
    );
  }

  function prepScroll(node, width) {
    Array.from(node.children).forEach(function (k) {
      const c = k.cloneNode(true);
      const t = k.getAttribute("transform");
      c.setAttribute("transform", "translate(" + width + " 0)" + (t ? " " + t : ""));
      node.appendChild(c);
    });
    node._width = width;
  }
  prepScroll(el.clouds, 1100);
  prepScroll(el.hillsFar, 1200);
  prepScroll(el.hillsN, 1200);
  prepScroll(el.groundBits, 1040);
  prepScroll(el.pebbles, 1040);

  function applyScroll(node, x) {
    const w = node._width;
    const t = ((x % w) + w) % w;
    node.setAttribute("transform", "translate(" + (-t).toFixed(2) + " 0)");
  }

  const dashLine = el.pathDashes.querySelector("line");

  const slines = Array.prototype.map.call(
    el.speedLines.querySelectorAll(".sline"),
    function (n, i) {
      const x1 = parseFloat(n.getAttribute("x1"));
      const x2 = parseFloat(n.getAttribute("x2"));
      return { node: n, x: x1, len: x2 - x1, phase: i * 0.33 };
    }
  );

  let groundScroll = 0;
  let cloudScroll = 0;
  let hillFarScroll = 0;
  let hillNearScroll = 0;
  let blinkT = 0;
  let blinkAt = 2.2;

  function frame(t, dt) {
    const wheelAng = t * WHEEL_SPEED;
    const crankAng = t * CRANK_SPEED;

    groundScroll += GROUND_SPEED * dt;
    cloudScroll += 28 * dt;
    hillFarScroll += GROUND_SPEED * 0.12 * dt;
    hillNearScroll += GROUND_SPEED * 0.28 * dt;

    const wdeg = (wheelAng * 180) / Math.PI;
    el.wheelRearSpin.setAttribute("transform", "translate(400 482) rotate(" + wdeg.toFixed(2) + ")");
    el.wheelFrontSpin.setAttribute("transform", "translate(575 482) rotate(" + wdeg.toFixed(2) + ")");

    const nearAng = crankAng;
    const farAng = crankAng + Math.PI;

    function placePedal(pedalNode, armNode, ang) {
      const px = Math.cos(ang) * CRANK_LEN;
      const py = Math.sin(ang) * CRANK_LEN;
      armNode.setAttribute("x2", px.toFixed(2));
      armNode.setAttribute("y2", py.toFixed(2));
      setTransform(pedalNode, px, py, 0);
      return { x: BB.x + px, y: BB.y + py };
    }

    const pedalNearPos = placePedal(el.pedalNear, el.crankNearArm, nearAng);
    const pedalFarPos  = placePedal(el.pedalFar,  el.crankFarArm,  farAng);

    function poseLeg(pathNode, footNode, hip, ankle, bendSign, footRotBase, footScale) {
      const r = ik(hip.x, hip.y, ankle.x, ankle.y, THIGH, SHIN, bendSign);
      pathNode.setAttribute(
        "d",
        "M " + hip.x + " " + hip.y + " L " + r.kx.toFixed(2) + " " + r.ky.toFixed(2) + " L " + r.ax.toFixed(2) + " " + r.ay.toFixed(2)
      );
      const tilt = Math.sin(crankAng * 2) * 8 + footRotBase;
      setTransform(footNode, r.ax, r.ay - 2, tilt, footScale);
    }

    poseLeg(el.legFar,  el.footFar,  HIP_FAR,  pedalFarPos,  -1, -4, 1.05);
    poseLeg(el.legNear, el.footNear, HIP_NEAR, pedalNearPos, -1,  2, 1.2);

    const bob = Math.sin(crankAng * 2) * 5;
    const sway = Math.sin(crankAng) * 2.2;
    const squash = 1 + Math.sin(crankAng * 2 + 0.4) * 0.02;
    const sy = 2 - squash;
    el.bobGroup.setAttribute(
      "transform",
      "translate(" + sway.toFixed(2) + " " + bob.toFixed(2) + ") " +
      "translate(488 500) scale(" + squash.toFixed(4) + " " + sy.toFixed(4) + ") translate(-488 -500)"
    );

    const sh = 1 - bob * 0.012;
    el.shadowG.setAttribute(
      "transform",
      "translate(488 532) scale(" + sh.toFixed(3) + " " + (1.15 - sh * 0.15).toFixed(3) + ")"
    );

    const wingNearA = -8 + Math.sin(crankAng * 2 + 0.2) * 10;
    const wingFarA  =  8 + Math.sin(crankAng * 2 + 0.2 + Math.PI) * 12;
    setPivotRotation(el.wingNear, wingNearA, 0, 0, 1, 1);
    setPivotRotation(el.wingFar,  wingFarA,  0, 0, 1, 1);

    setPivotRotation(el.tail, Math.sin(crankAng * 2 + 0.8) * 7, 0, 0, 1, 1);

    const headA = Math.sin(crankAng * 2 - 0.45) * 4;
    const headDx = Math.sin(crankAng * 2 - 0.35) * 1.5;
    const headDy = Math.sin(crankAng * 2 - 0.6) * 2.5;
    setPivotRotation(el.head, headA, headDx, headDy, 1, 1);

    const gape = 1 + Math.sin(t * 3.1) * 0.035;
    el.pouch.setAttribute(
      "transform",
      "translate(0 0) scale(1 " + gape.toFixed(3) + ") translate(0 " + (-274 * (gape - 1)).toFixed(2) + ")"
    );
    el.fishTail.setAttribute(
      "transform",
      "translate(636 318) rotate(" + (Math.sin(t * 5.5) * 10).toFixed(2) + ")"
    );

    blinkT += dt;
    if (blinkT > blinkAt) {
      const k = blinkT - blinkAt;
      if (k < 0.12) {
        el.eyelid.setAttribute("opacity", String(Math.min(1, k / 0.05)));
      } else if (k < 0.22) {
        el.eyelid.setAttribute("opacity", String(Math.max(0, 1 - (k - 0.12) / 0.08)));
      } else {
        el.eyelid.setAttribute("opacity", "0");
        blinkT = 0;
        blinkAt = 2.4 + Math.random() * 2.5;
      }
    }

    function waveStreamer(node, phase, amp) {
      const a = Math.sin(t * 6 + phase) * amp;
      const b = Math.sin(t * 6 + phase + 1.1) * amp * 1.3;
      node.setAttribute(
        "d",
        "M616 384 Q " + (632 + a).toFixed(1) + " " + (396 + b * 0.3).toFixed(1) + " " + (628 + b).toFixed(1) + " " + (418 + a * 0.6).toFixed(1)
      );
    }
    waveStreamer(el.streamer1, 0.0, 8);
    waveStreamer(el.streamer2, 1.7, 7);
    waveStreamer(el.streamer3, 3.2, 9);

    const cardA = Math.sin(t * 9) * 6;
    el.card.setAttribute("transform", "translate(22 -24) rotate(" + (-18 + cardA).toFixed(2) + ")");

    applyScroll(el.clouds, cloudScroll);
    applyScroll(el.hillsFar, hillFarScroll);
    applyScroll(el.hillsN, hillNearScroll);
    applyScroll(el.groundBits, groundScroll);
    applyScroll(el.pebbles, groundScroll * 0.95);

    dashLine.setAttribute("stroke-dashoffset", String(-groundScroll));

    slines.forEach(function (s, i) {
      let x = s.x - (groundScroll * 0.55 + s.phase * 200);
      const span = 1100;
      x = ((x % span) + span) % span - 80;
      s.node.setAttribute("x1", x.toFixed(1));
      s.node.setAttribute("x2", (x + s.len).toFixed(1));
      const o = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3 + i));
      s.node.setAttribute("opacity", o.toFixed(2));
    });
  }

  function poseStatic() { frame(0.35, 0); }

  let raf = 0;
  let last = 0;
  let running = false;

  function loop(now) {
    if (!running) return;
    const t = now / 1000;
    const dt = Math.min(0.05, last ? t - last : 0.016);
    last = t;
    frame(t, dt);
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    running = true;
    last = 0;
    raf = requestAnimationFrame(loop);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  function applyMotionPreference() {
    if (reduced.matches) {
      stop();
      poseStatic();
    } else {
      start();
    }
  }

  if (reduced.addEventListener) reduced.addEventListener("change", applyMotionPreference);
  else if (reduced.addListener) reduced.addListener(applyMotionPreference);

  applyMotionPreference();
})();
</script>
</body>
</html>
