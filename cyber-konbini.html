<script type="module">

const DS = THREE.DoubleSide;

scene.add(world, city, fx, mirror);
const hash1 = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const drift = (x, s) => Math.sin(x + s) * 0.55 + Math.sin(x * 1.73 + s * 2.1) * 0.3 + Math.sin(x * 3.31 + s * 0.7) * 0.15;
const rgb = (hex, k = 1) => new THREE.Color(hex).multiplyScalar(k);
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function texOf(canvasEl, rx, ry, srgb = true) {
  const t = new THREE.CanvasTexture(canvasEl);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;

}
function glowText(x, text, px, py, color, core, size, align) {
  x.save();

  x.textAlign = align || 'center';
  x.textBaseline = 'middle';
  x.shadowColor = color;
  x.shadowBlur = size * 0.6;
  x.fillStyle = color;
  x.fillText(text, px, py);
  x.shadowBlur = size * 0.28;
  x.fillText(text, px, py);
  x.shadowBlur = 0;
  x.fillStyle = core;
  x.fillText(text, px, py);
  x.restore();
}
function scanlines(x, w, h, step, alpha) {
  x.save();
  x.globalAlpha = alpha;
  for (let y = 0; y < h; y += step) { x.fillStyle = '#0a1030'; x.fillRect(0, y, w, 1); }
  x.restore();
}

}

function interiorWallCanvas() {

function windowCanvas(seed, warm, sparse) {
  const c = cvs(128, 256), x = c.getContext('2d'), R = mulberry32(seed);
  x.fillStyle = '#04060e'; x.fillRect(0, 0, 128, 256);
  const pal = warm ? ['#ffdca8', '#ffb867', '#fff2d0', '#ff8a5c'] : ['#7fe9ff', '#ff8ae0', '#c9d6ff', '#9fffd0', '#5f8cff'];
  x.fillStyle = 'rgba(70,86,120,.16)';

  for (let r = 0; r < 10; r++) {
    for (let i = 0; i < 5; i++) {

      x.fillStyle = pal[(R() * pal.length) | 0];
      x.fillRect(i * 25 + 6, r * 25 + 6, 14, 13);

  return c;
}
function billboardCanvas(text, glow, core, sub) {

function rainCanvas() {
  const w = 32, h = 128, c = cvs(w, h), x = c.getContext('2d'), img = x.createImageData(w, h);
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const u = (i + 0.5 - w / 2) / (w / 2);
      const v = j / h;
      const sx = Math.exp(-u * u * 34.0);
      const sy = Math.min(1, v / 0.13) * (1 - Math.max(0, (v - 0.86) / 0.14));
      const a = Math.max(0, sx * sy);
      const k = (j * w + i) * 4;
      img.data[k] = 255; img.data[k + 1] = 255; img.data[k + 2] = 255;
      img.data[k + 3] = Math.round(255 * a);

  }
  x.putImageData(img, 0, 0);
  return c;

}

function cyl(r1, r2, h, mat, x, y, z, parent, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg || 10), mat);
  m.position.set(x, y, z);

function tube(pts, radius, mat, parent, closed, seg) {
  const curve = new THREE.CatmullRomCurve3(pts, !!closed, 'centripetal');
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, seg || 220, radius, 6, !!closed), mat);
  parent.add(m);
  return m;
}
function rrectPts(w, h, r, z, cx, cy, cornerSeg) {
  const pts = [], hw = w / 2 - r, hh = h / 2 - r, cs = cornerSeg || 6;
  const ox = cx || 0, oy = cy || 0;
  const corners = [[hw + ox, hh + oy, 0], [-hw + ox, hh + oy, Math.PI / 2], [-hw + ox, -hh + oy, Math.PI], [hw + ox, -hh + oy, Math.PI * 1.5]];
  for (let c = 0; c < 4; c++) {
    for (let i = 0; i <= cs; i++) {
      const a = corners[c][2] + (Math.PI / 2) * (i / cs);
      pts.push(new THREE.Vector3(corners[c][0] + Math.cos(a) * r, corners[c][1] + Math.sin(a) * r, z));
    }
  }
  return pts;
}

  geo.setAttribute('aSpeed', new THREE.BufferAttribute(spd, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));

      'uniform float uTime; uniform vec3 uCam; uniform float uFlash; uniform float uPix;',
      'attribute float aSpeed; attribute float aSize;',
      'varying float vA;',
      'void main(){',
      '  vec3 p = position;',
      '  p.y = mod(p.y - uTime * aSpeed, ' + RAIN_H.toFixed(1) + ');',
      '  vec2 rel = p.xz - uCam.xz;',
      '  p.xz = mod(rel + ' + (RAIN_BOX / 2).toFixed(1) + ', ' + RAIN_BOX.toFixed(1) + ') - ' + (RAIN_BOX / 2).toFixed(1) + ' + uCam.xz;',
      '  p.x += (' + RAIN_H.toFixed(1) + ' - p.y) * 0.05;',
      '  p.z += (' + RAIN_H.toFixed(1) + ' - p.y) * 0.018;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  gl_Position = projectionMatrix * mv;',
      '  float d = -mv.z;',
      '  gl_PointSize = clamp(uPix * 132.0 * aSize / max(d, 0.6), 1.5, 38.0);',
      '  float fade = 1.0 - clamp((d - 7.0) / 38.0, 0.0, 1.0);',
      '  fade *= smoothstep(0.35, 2.4, d);',
      '  vA = fade * (0.05 + 0.15 * clamp(aSize, 0.0, 1.6)) * (1.0 + uFlash * 0.45);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uMap; uniform vec3 uColor; uniform float uFlash;',
      'varying float vA;',
      'void main(){',
      '  float a = texture2D(uMap, gl_PointCoord).a * vA;',
      '  if (a < 0.004) discard;',
      '  vec3 c = mix(uColor, vec3(0.82, 0.88, 1.0), uFlash * 0.7);',
      '  gl_FragColor = vec4(c * (0.85 + uFlash * 0.5), a);',
      '}'
    ].join('\n')
  });
  const pts = new THREE.Points(geo, mat);

  hintTimer = setTimeout(hideHint, 12000);
}

let hintTimer = setTimeout(hideHint, 9000);
function hideHint() {
  clearTimeout(hintTimer);
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0.28';
}

document.getElementById('mode').addEventListener('click', () => setFP(!fp.on));
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') setFP(!fp.on);
  if (fp.on && ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

canvas.addEventListener('click', () => {
  if (!fp.on || locked) return;
  try {
    const pr = canvas.requestPointerLock();
    if (pr && typeof pr.catch === 'function') pr.catch(() => {});
  } catch (e) { }
});
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === canvas; });
document.addEventListener('mousemove', e => {
  if (!locked) return;
  fp.tYaw -= e.movementX * 0.0028;
  fp.tPitch = clamp(fp.tPitch - e.movementY * 0.0023, -1.15, 1.02);
});

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  if (fp.on && e.pointerType !== 'mouse' && stick.id === null && e.clientX < innerWidth * 0.55 && e.clientY > innerHeight * 0.4) {
    stick.id = e.pointerId;
    stick.x0 = e.clientX; stick.y0 = e.clientY;
    stick.dx = 0; stick.dy = 0;
    stickEl.style.left = (e.clientX - 52) + 'px';
    stickEl.style.top = (e.clientY - 52) + 'px';
    stickEl.classList.add('on');
    return;
  }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!fp.on) canvas.classList.add('drag');
  if (ptrs.size === 2) {
    const p = [...ptrs.values()];
    pinchLen = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  hideHint();
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    stick.dx = clamp((e.clientX - stick.x0) / 52, -1, 1);
    stick.dy = clamp((e.clientY - stick.y0) / 52, -1, 1);
    stickEl.firstElementChild.style.transform = 'translate(' + (stick.dx * 30).toFixed(1) + 'px,' + (stick.dy * 30).toFixed(1) + 'px)';
    return;
  }
  if (locked) return;
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (fp.on) {
    if (ptrs.size === 1) {
      fp.tYaw -= dx * 0.0032;
      fp.tPitch = clamp(fp.tPitch - dy * 0.0024, -1.15, 1.02);
    }
  } else if (ptrs.size === 1) {
    cam.tYaw = clamp(cam.tYaw - dx * 0.0034, -1.05, 1.05);
    cam.tPitch = clamp(cam.tPitch - dy * 0.0023, -0.42, 0.55);
  } else if (ptrs.size >= 2) {
    const q = [...ptrs.values()];
    const len = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
    if (pinchLen > 0) cam.tDist = clamp(cam.tDist * (pinchLen / Math.max(len, 1)), 5.5, 26);
    pinchLen = len;
  }
});
function endPtr(e) {
  if (e.pointerId === stick.id) stickReset();
  ptrs.delete(e.pointerId);
  pinchLen = 0;
  if (!ptrs.size) canvas.classList.remove('drag');
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (fp.on) return;
  cam.tDist = clamp(cam.tDist * (1 + e.deltaY * 0.0012), 5.5, 26);
  hideHint();
}, { passive: false });

/* ---------------- lightning ---------------- */

const strike = { timer: 3.2, flash: 0, seq: [], i: 0, t: 0 };
function fireStrike() {
  const n = 2 + ((Math.random() * 3) | 0);
  const seq = [];
  let tt = 0;
  for (let i = 0; i < n; i++) {
    seq.push({ at: tt, s: 0.45 + Math.random() * 1.25 });
    tt += 0.045 + Math.random() * 0.2;
  }
  seq.push({ at: tt + 0.22, s: 1.5 + Math.random() * 0.6 });
  strike.seq = seq;
  strike.i = 0;
  strike.t = 0;
}

/* ---------------- post ---------------- */

const rt = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt);
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.62, 0.36, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  rainUniforms.uPix.value = renderer.getPixelRatio();
  rippleUniforms.uPix.value = renderer.getPixelRatio();
});

/* ---------------- loop ---------------- */

const clock = new THREE.Clock();
let t0 = 0;
let ready = false;

function update(dt) {
  t0 += dt;
  const t = t0;

  cam.yaw += (cam.tYaw - cam.yaw) * Math.min(1, dt * 5.0);
  cam.pitch += (cam.tPitch - cam.pitch) * Math.min(1, dt * 5.0);
  cam.dist += (cam.tDist - cam.dist) * Math.min(1, dt * 3.4);
  fp.blend += ((fp.on ? 1 : 0) - fp.blend) * Math.min(1, dt * 1.9);
  const blend = fp.blend * fp.blend * (3 - 2 * fp.blend);

  const dY = drift(t * 0.9, 1.7) * 0.02;
  const dP = drift(t * 0.77, 4.2) * 0.013;
  const dR = drift(t * 0.61, 8.4) * 0.017;
  const oYaw = cam.yaw + dY;
  const oPitch = clamp(cam.pitch + dP, -0.48, 0.6);
  const cd = cam.dist;
  oPos.set(
    cam.pivot.x + Math.sin(oYaw) * Math.cos(oPitch) * cd + drift(t * 0.47, 5.5) * 0.045,
    cam.pivot.y + Math.sin(oPitch) * cd + Math.sin(t * 1.1) * 0.028 + drift(t * 0.83, 3.3) * 0.03,
    cam.pivot.z + Math.cos(oYaw) * Math.cos(oPitch) * cd
  );
  oTgt.set(
    cam.pivot.x + drift(t * 0.52, 9.1) * 0.16,
    cam.pivot.y + drift(t * 0.43, 2.2) * 0.12,
    cam.pivot.z
  );

  if (fp.blend > 0.0005) {
    fp.yaw += (fp.tYaw - fp.yaw) * Math.min(1, dt * 8.0);
    fp.pitch += (fp.tPitch - fp.pitch) * Math.min(1, dt * 8.0);
    vF.set(-Math.sin(fp.yaw), 0, -Math.cos(fp.yaw));
    vR.set(Math.cos(fp.yaw), 0, -Math.sin(fp.yaw));
    vW.set(0, 0, 0);
    if (keys.KeyW || keys.ArrowUp) vW.add(vF);
    if (keys.KeyS || keys.ArrowDown) vW.sub(vF);
    if (keys.KeyD || keys.ArrowRight) vW.add(vR);
    if (keys.KeyA || keys.ArrowLeft) vW.sub(vR);
    if (stick.dx !== 0 || stick.dy !== 0) {
      vW.addScaledVector(vF, -stick.dy);
      vW.addScaledVector(vR, stick.dx);
    }
    const want = (keys.ShiftLeft || keys.ShiftRight) ? 6.2 : 3.1;
    if (vW.lengthSq() > 0) {
      const mag = Math.min(1, Math.sqrt(vW.lengthSq()));
      vW.normalize().multiplyScalar(want * mag);
    }
    fp.vel.lerp(vW, Math.min(1, dt * 7));
    fp.pos.addScaledVector(fp.vel, dt);
    fp.pos.x = clamp(fp.pos.x, BOUND.x0, BOUND.x1);
    fp.pos.z = clamp(fp.pos.z, BOUND.z0, BOUND.z1);
    for (const c of colliders) {
      const ddx = fp.pos.x - c[0], ddz = fp.pos.z - c[1];
      const dd = Math.hypot(ddx, ddz), rr = c[2] + 0.36;
      if (dd < rr && dd > 1e-4) {
        fp.pos.x = c[0] + (ddx / dd) * rr;
        fp.pos.z = c[1] + (ddz / dd) * rr;
      }
    }
    fp.speed = Math.hypot(fp.vel.x, fp.vel.z);
    fp.phase += dt * (2.1 + fp.speed * 1.8);
    const amp = 0.027 * Math.min(1, fp.speed / 3.1);
    fp.bobY = Math.sin(fp.phase * 2) * amp - amp * 0.35;
    fp.bobX = Math.cos(fp.phase) * amp * 1.4;
    fp.roll = Math.cos(fp.phase) * 0.007 * Math.min(1, fp.speed / 3.1) + Math.sin(t * 0.7) * 0.004;
  }
  const curb = 0.12 * clamp((-3.6 - fp.pos.z) / 0.35, 0, 1);
  pPos.set(
    fp.pos.x + fp.bobX * 0.5 + drift(t * 1.3, 6.1) * 0.012,
    curb + EYE + fp.bobY + Math.sin(t * 1.15) * 0.012 + drift(t * 0.9, 3.7) * 0.014,
    fp.pos.z
  );
  const fYaw = fp.yaw + dY * 0.6;
  const fPitch = clamp(fp.pitch + dP * 0.5, -1.2, 1.05);
  pTgt.set(
    pPos.x - Math.sin(fYaw) * Math.cos(fPitch) * 7,
    pPos.y + Math.sin(fPitch) * 7,
    pPos.z - Math.cos(fYaw) * Math.cos(fPitch) * 7
  );

  camera.position.lerpVectors(oPos, pPos, blend);
  lookTgt.lerpVectors(oTgt, pTgt, blend);
  camera.lookAt(lookTgt);
  camera.rotateZ(dR * (1 - 0.75 * blend) + fp.roll * blend);

  const fovWant = (camera.aspect < 1 ? 12 : 0) + FOV_A + (FOV_B - FOV_A) * blend;
  if (Math.abs(camera.fov - fovWant) > 0.02) {
    camera.fov = fovWant;
    camera.updateProjectionMatrix();
  }

  strike.timer -= dt;
  if (strike.timer <= 0) {
    fireStrike();
    strike.timer = 3.4 + Math.random() * 8.5;
  }
  strike.t += dt;
  while (strike.i < strike.seq.length && strike.t >= strike.seq[strike.i].at) {
    strike.flash = strike.seq[strike.i].s;
    strike.i++;
  }
  strike.flash = Math.max(0, strike.flash - dt * 2.4);
  const fl = Math.min(1.1, strike.flash) * (0.78 + 0.22 * Math.sin(t * 62));
  bolt.intensity = 0.02 + fl * 3.2;
  bolt.position.set(34 + drift(t, 1) * 8, 46, -26 + drift(t, 3) * 10);
  hemi.intensity = 0.55 + fl * 0.3;
  ambient.intensity = 0.5 + fl * 0.12;
  lampLightA.intensity = 62 * (1 - fl * 0.25);
  lampLightB.intensity = 52 * (1 - fl * 0.25);
  scene.fog.color.lerpColors(FOG_BASE, FOG_FLASH, Math.min(1, fl * 0.5));
  skyUniforms.uFlash.value = fl * 0.22;
  sky.position.copy(camera.position);
  rainUniforms.uFlash.value = fl;
  rippleUniforms.uFlash.value = fl;
  bloom.strength = 0.62 + fl * 0.28;
  bloom.threshold = 0.95 - fl * 0.18;

  for (const p of pulses) {
    const g2 = hash1(Math.floor(t * 11 + p.seed));
    const target = g2 < p.drop ? 0.1 : 1;
    p.v += (target - p.v) * Math.min(1, dt * (target > p.v ? 20 : 8));
    const sh = 0.93 + 0.1 * Math.sin(t * p.f + p.seed * 5.1);
    p.m.color.copy(p.base).multiplyScalar(p.k * p.v * sh);
  }
  for (const a of anim) {
    if (a.sp < 0.002) {
      a.o.rotation.y = a.ph + Math.sin(t * 0.4 + a.ph) * 0.35;
    } else {
      a.o.rotation.y = t * a.sp + a.ph;
    }
    a.o.position.y = a.y0 + Math.sin(t * a.bf + a.ph) * a.ba;
    a.o.rotation.z = Math.sin(t * 0.53 + a.ph) * 0.06;
  }
  for (const u of updaters) u(t, dt);

  const mp = mist.geometry.attributes.position;
  const ms = mist.geometry.attributes.aSeed;
  for (let i = 0; i < mp.count; i++) {
    let y = mp.getY(i) + dt * (0.09 + (i % 5) * 0.02);
    if (y > 8) y = -0.6;
    mp.setY(i, y);
    mp.setX(i, mp.getX(i) + Math.sin(t * 0.13 + ms.getX(i)) * dt * 0.12);
  }
  mp.needsUpdate = true;

  rainUniforms.uTime.value = t;
  rainUniforms.uCam.value.copy(camera.position);
  rippleUniforms.uTime.value = t;
  rippleGroup.position.x = camera.position.x;
  rippleGroup.position.z = camera.position.z;

  composer.render();

  if (!ready) {
    ready = true;
    window.__sceneReady = true;
    const l = document.getElementById('loader');
    l.classList.add('hide');
    setTimeout(() => l.remove(), 1200);
  }
}

function tick() {
  requestAnimationFrame(tick);
  update(Math.min(0.05, clock.getDelta()));
}
tick();
window.__step = (n, dt) => { for (let i = 0; i < (n || 1); i++) update(dt || 0.0166667); };

window.__strike = fireStrike;
window.__dbg = { THREE: THREE, renderer: renderer, scene: scene, camera: camera, cam: cam, fp: fp, stick: stick, setFP: setFP, composer: composer };

setTimeout(() => {
  if (!window.__sceneReady) {
    const s = document.querySelector('#loader span');
    if (s) s.textContent = '需要联网加载 three.js CDN';
  }
}, 7000);
</script>
</body>
</html>
